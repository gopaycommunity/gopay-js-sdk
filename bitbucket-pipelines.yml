image: node:24

definitions:
  caches:
    yarn-global: ~/.yarn
    yarn-cache: .yarn/cache

  services:
    docker2x:
      type: docker
      memory: 4096

  steps:
    - step: &code-quality
        name: Code Quality Checks
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          - yarn dedupe --check
          - yarn ci
          - yarn npm audit --recursive --environment production


    # --- unit + e2e tests + coverage ---------------------------------
    # E2E requires repository variables (mark as Secured in Bitbucket settings):
    #   GOPAY_PAYMENTS_V4_BASE_URL, GOPAY_PAYMENTS_V4_CLIENT_ID, GOPAY_PAYMENTS_V4_CLIENT_SECRET,
    #   GOPAY_PAYMENTS_V4_GOID, GOPAY_PAYMENTS_V4_SHAREABLE_KEY
    - step: &test-vitest
        name: Tests & coverage
        runs-on:
          - cypress
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          - yarn workspace @gopaycz/gopay-js-sdk run test
          - yarn workspace @gopaycz/gopay-js-sdk-browser run test
          - sed -i 's|^SF:src/|SF:sdk/src/|' sdk/coverage/lcov.info
          - sed -i 's|^SF:src/|SF:browser-sdk/src/|' browser-sdk/coverage/lcov.info
        artifacts:
          - sdk/coverage/**
          - sdk/test-results/**
          - browser-sdk/coverage/**
          - browser-sdk/test-results/**

    - step: &test-stress
        name: Stress tests (leak detection)
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          - yarn workspace @gopaycz/gopay-js-sdk-browser run test:stress
        artifacts:
          - browser-sdk/test-results/stress-junit.xml

    - step: &sonar
        name: Analyze on SonarCloud
        size: 2x
        services:
          - docker2x
        clone:
          depth: full
        script:
          - pipe: sonarsource/sonarcloud-scan:4.1.0
            variables:
              SONAR_SCANNER_OPTS: -Xmx2560m
              EXTRA_ARGS: -Dsonar.projectKey=gp-gopay_gp-gw-js-sdk
                -Dsonar.organization=gp-gopay
                -Dsonar.sources=sdk/src,browser-sdk/src
                -Dsonar.tests=sdk/tests
                -Dsonar.inclusions=sdk/src/**/*.ts,browser-sdk/src/**/*.ts
                -Dsonar.exclusions=**/*.spec.ts,**/*.test.ts,sdk/src/types/generated.ts,browser-sdk/src/types/generated.ts
                -Dsonar.javascript.lcov.reportPaths=sdk/coverage/lcov.info,browser-sdk/coverage/lcov.info
          - pipe: sonarsource/sonarcloud-quality-gate:0.2.0

    - step: &release-preview
        name: Release preview (dry-run)
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          # sdk/ is the umbrella version (analyzes ALL commits repo-wide, see release.config.mjs),
          # so if IT finds nothing releasable, nothing in the whole PR is fix/feat/BREAKING CHANGE —
          # gate on it. browser-sdk/ is filtered to browser-sdk/ files only, so its own "no release"
          # is often expected and is previewed but not gated.
          - ./scripts/release-preview.sh @gopaycz/gopay-js-sdk --gate
          - ./scripts/release-preview.sh @gopaycz/gopay-js-sdk-browser

    - step: &build
        name: Build SDK
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          - yarn workspace @gopaycz/gopay-js-sdk run build
          - yarn workspace @gopaycz/gopay-js-sdk-browser run build
        artifacts:
          - sdk/dist/**
          - browser-sdk/dist/**
 
    - step: &test-playwright
        name: Browser smoke test (IIFE)
        image: &playwright-image mcr.microsoft.com/playwright:v1.59.1-noble
        runs-on:
          - cypress
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          - yarn workspace @gopaycz/gopay-js-sdk run build
          # browser-sdk was previously built nowhere on a PR — not here, not in
          # the Docker dry-run — so a broken tsup build first failed on master.
          # browser-sdk-iife.spec.ts also loads dist/gopay-browser-sdk.min.js
          # directly: the example serves TypeScript source through Vite aliases,
          # so without this the bundle is never executed by anything.
          - yarn workspace @gopaycz/gopay-js-sdk-browser run build
          - yarn test:e2e
        artifacts:
          - playwright-report/**

    # Manual, on-demand counterpart to *test-playwright: the same suite, but the gateway comes
    # from the run form instead of the workspace variable. Triggered by hand from any branch, so
    # a change to it can be exercised before the branch is merged.
    #
    # runs-on: [cypress] for every target, not only the private ones. alpha* and the personal
    # environments answer inside the dev network and that runner is the only executor reaching
    # them; gate.test and sandbox are public and would run on Bitbucket's hosted runners too,
    # but runs-on takes no variable, so one pipeline means one executor. Queueing on the shared
    # slot is the accepted cost of not maintaining two pipelines.
    - step: &test-playwright-on-env
        name: Browser E2E against chosen env
        image: *playwright-image
        runs-on:
          - cypress
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          # Refuse a blank target rather than degrade into a different one. Exporting an empty
          # GOPAY_PAYMENTS_V4_BASE_URL clobbers the workspace value, and example/src/sdk.js
          # resolves it with `??`, which does not catch '' - it then falls through to
          # { environment: 'sandbox' } and the suite would create real payments on the public
          # sandbox while the step name still said "chosen env".
          - if [ -z "$TARGET_BASE_URL" ]; then echo "TARGET_BASE_URL is empty - pick a target"; exit 1; fi
          # TARGET_BASE_URL is free text, so nothing constrains it before the run starts. Refuse
          # production here rather than let it reach the example's own assertNotProduction():
          # this costs a second, that costs an install and two builds first.
          # Lowercased first: DNS is case-insensitive, so https://GATE.GOPAY.COM reaches production
          # while failing a case-sensitive test. assertNotProduction() widens the same way.
          - case "$(printf '%s' "$TARGET_BASE_URL" | tr '[:upper:]' '[:lower:]')" in *gate.gopay.com*) echo "refusing to run against production"; exit 1 ;; esac
          - export GOPAY_PAYMENTS_V4_BASE_URL="$TARGET_BASE_URL"
          # Only the URL is swapped. GOPAY_PAYMENTS_V4_CLIENT_ID/_CLIENT_SECRET/_GOID stay on the
          # workspace set, and an OAuth client belongs to one gateway - so until per-environment
          # secured variables exist (the GOPAY_PAYMENTS_V4_SANDBOX_* pattern demo-site already
          # uses), every target except the one that set was provisioned for fails on 401 at
          # /oauth2/token. Deliberately not overridable from the run form: custom-pipeline
          # variables are not masked in the log, so a secret typed there would be published in
          # plain text.
          # Both bundles, for the reason spelled out on *test-playwright above.
          - yarn workspace @gopaycz/gopay-js-sdk run build
          - yarn workspace @gopaycz/gopay-js-sdk-browser run build
          - yarn test:e2e
        artifacts:
          - playwright-report/**

    - step: &release
        name: Release
        deployment: production
        caches:
          - yarn-global
          - yarn-cache
        script:
          - corepack enable
          - yarn install --immutable
          - yarn workspace @gopaycz/gopay-js-sdk run build
          - yarn workspace @gopaycz/gopay-js-sdk-browser run build
          - REPO_URL=https://gopay-release-bot:$BITBUCKET_BOT_PUSH_TOKEN@bitbucket.org/$BITBUCKET_REPO_FULL_NAME.git
          - git remote set-url origin $REPO_URL
          # Does NOT publish to npm (npmPublish: false) — that moved to .github/workflows/npm-publish.yml.
          # sdk/ (@gopaycz/gopay-js-sdk) analyzes ALL commits and bumps on every releasable change — its
          # version drives the Docker deploy tag. browser-sdk/ (@gopaycz/gopay-js-sdk-browser) only bumps
          # when browser-sdk/ files changed (filtered by semantic-release-monorepo).
          - (cd sdk && yarn dlx semantic-release)
          - (cd browser-sdk && yarn dlx semantic-release)
          - npm pkg get version --prefix sdk | tr -d '"' > version
          - npm pkg get version --prefix browser-sdk | tr -d '"' > browser-sdk-version
          # Immutable upper bound for the tag range the sync step dispatches. Recorded here
          # because master can move on while the docker step runs.
          - git rev-parse HEAD > release-head
        artifacts:
          - version
          - browser-sdk-version
          - release-head
    # No token anywhere: push via the repository SSH key (GitHub deploy key), publish is watched anonymously.
    - step: &github-sync
        name: Sync master to GitHub
        clone:
          depth: full
        script:
          - export GITHUB_REPO=gopaycommunity/gopay-js-sdk
          - git fetch origin master --tags
          - git remote add github git@github.com:${GITHUB_REPO}.git
          # --force: GitHub's existing master/tags are the old orphan snapshot commits (unrelated
          # history to the real graph being pushed here for the first time). Without --force this
          # push is rejected as a non-fast-forward. NOTE: the mirror is no longer inert — GitHub
          # builds and publishes to npm from these tags, so a re-delivered tag can retrigger a
          # publish. That is why npm-publish.yml uses --tolerate-republish and guards `latest`.
          - git push github origin/master:refs/heads/master --force
          # New release tags go one per push (GitHub drops tag events above three) and start npm-publish.yml; the script waits for it.
          - ./scripts/publish-wait.sh
          # Idempotent catch-up of any older tag the mirror lacks; new ones are already there, so this emits no events.
          - git push github --tags --force

    - step: &docker-build-push
        name: Build & push example Docker image
        size: 2x
        services:
          - docker2x
        script:
          - ./scripts/bitbucket-config.sh
          - VERSION=$(cat version)
          - BROWSER_VERSION=$(cat browser-sdk-version)
          - IMAGE="repo.gopay.com/gp-gw-js-sdk:${VERSION}"
          - IMAGE_NOT_EXISTS=true; docker pull "$IMAGE" > /dev/null 2>&1 && IMAGE_NOT_EXISTS=false
          - if [ "$IMAGE_NOT_EXISTS" = true ]; then (docker build --build-arg SDK_VERSION="$VERSION" --build-arg BROWSER_SDK_VERSION="$BROWSER_VERSION" . -t "$IMAGE" && docker push "$IMAGE"); fi

    - step: &docker-build-dry-run
        name: Build example Docker image (dry-run)
        size: 2x
        services:
          - docker2x
        script:
          - ./scripts/bitbucket-config.sh
          - docker build --build-arg SDK_VERSION=dev . -t repo.gopay.com/gp-gw-js-sdk:latest

pipelines:
  branches:
    master:
      - parallel:
        - step: *test-vitest
        - step: *test-stress
        - step: *build
        - step: *test-playwright
      - step: *release
      - step: *docker-build-push
      - step: *github-sync
      - step: *sonar
  pull-requests:
    '**':
      - parallel:
          - step: *code-quality
          - step: *test-vitest
          - step: *test-stress
          - step: *release-preview
          - step: *test-playwright
          - step: *docker-build-dry-run
      - step: *sonar
  custom:
    # Pipelines -> Run pipeline -> pick a branch and "e2e-on-env", then type the gateway to hit.
    # TARGET_BASE_URL is free text rather than a dropdown so a freshly started personal
    # environment needs no change here. Nothing constrains it up front, so the step refuses a
    # production host itself; assertNotProduction() in example/runtime-config.js is the backstop,
    # and it does fire on this path - vite.config.ts serves /env.js through the same emitter as
    # serve.js. (sdk/tests/e2e/_helpers.ts guards the vitest suite, which `yarn test:e2e` -
    # playwright over sdk/tests/browser - never loads.)
    #
    # Known-good values to paste:
    #   dev cluster - works today with the workspace credentials, verified against jmuller:
    #     https://gw.alpha9.dev.gopay.com/api/merchant/payments/4.0
    #     https://gw.<user>.dev.gopay.com/api/merchant/payments/4.0
    #   aws-test - public and up 24/7, but 401s until a secured variable holds its own client:
    #     https://gate.test.gopay.com/gp-gw/api/4.0
    #
    # The dev cluster serves v4 under a different path than test does, so the two are not
    # interchangeable. alpha8 is not listed: it was renumbered to alpha9 and the certificate no
    # longer covers the old name, so it fails at the TLS handshake. The public sandbox is not
    # listed either - no credentials for it exist yet.
    e2e-on-env:
      - variables:
          - name: TARGET_BASE_URL
            default: https://gate.test.gopay.com/gp-gw/api/4.0
      - step: *test-playwright-on-env
