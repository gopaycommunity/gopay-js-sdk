  schemas:
    Client-Credentials-Request:
      type: object
      title: Client Credentials Request
      description: Requests a merchant access token with the `client_credentials` grant
      required:
        - grant_type
        - scope
      properties:
        grant_type:
          type: string
          const: client_credentials
          description: Always `client_credentials` for this flow
          examples:
            - client_credentials
        scope:
          type: string
          description: |-
            List of required token scopes, separated with a space.
            - `payment:read` reads payments and the resources built on them, such as charges, refunds, recurrences and payment links
            - `payment:write` creates, charges, cancels and modifies payments and those same resources
            - `card:read` reads saved card tokens
            - `card:write` saves and deletes card tokens
            - `event:read` reads the eshop's events
            - `shared:read` reads public resources such as public keys
          examples:
            - 'payment:write payment:read'
    Payment-Credentials-Request:
      type: object
      title: Payment Credentials Request
      description: Requests a payment-scoped access token with the `payment_credentials` grant
      required:
        - grant_type
        - scope
      properties:
        grant_type:
          type: string
          const: payment_credentials
          description: Always `payment_credentials` for this flow
          examples:
            - payment_credentials
        scope:
          type: string
          description: |-
            List of required token scopes, separated with a space.
            - `payment:read` reads the payment
            - `payment:charge` charges the payment
          examples:
            - 'payment:charge payment:read'
    Access-Token:
      type: object
      title: Access Token
      description: The access token and its meta information.
      properties:
        token_type:
          type: string
          const: bearer
          description: Always `bearer`
          default: bearer
          examples:
            - bearer
        access_token:
          $ref: '#/components/schemas/JWT'
          description: The access token, presented as a Bearer token
        scope:
          type: string
          description: |
            Space-separated list of token scopes.
          examples:
            - 'payment:write payment:read'
        expires_in:
          type: integer
          description: The expiration of the access JWT in seconds
          minimum: 0
          examples:
            - 900
    JWT:
      type: string
      title: JWT
      description: |-
        The JWT string as described by [RFC 7519: JSON Web Token (JWT)](https://datatracker.ietf.org/doc/html/rfc7519)

        The JWT claims contain:
        - `sub` -> the Client ID for which the token was issued
        - `scope` -> the scopes of the token
        - `iat` -> timestamp of token issuing
        - `exp` -> timestamp of token expiration
        - `domain` -> `merchant` for tokens issued to the merchant's server with the `client_credentials` grant, `payment` for payment-scoped tokens issued with the `payment_credentials` grant to the GoPay client SDK
      examples:
        - eyJraWQiOiJzaWduLTIwMjYtMDIiLCJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwic2NvcGUiOiJwYXltZW50OndyaXRlIHBheW1lbnQ6cmVhZCIsImRvbWFpbiI6Im1lcmNoYW50IiwiaWF0IjoxNzczMzE5NTkzLCJleHAiOjE3NzMzMjA0OTN9.WlrmAZT9FLeuaHz9Gp79HeAZh8S0AtYEXbu4pOghXt4f3qv6xNHa8XX3AlvcnN3dKHD8VYWtVhLiUY2DFpGnKZQN97DY91lrStimpRSX9AY5xtOB1sZzNayEpu6MjspVv6IlNrcl2YHYFgqIN1GdFUCKCFetW9Vrm3IjSQCxWA7abo5XqxJyTP_ue7ybSz7y4xiUFNH8cIKpX0PEV3svyoXnbE58UEVktzIWsLA1PnjhtFcxsWT5y1Y_bR8OVxUVTiS0TfMoA1ETQ9ybI7IbX3sttzXnRfnwsn0iS5g96NrrJh2wDvSFQ2fwO_xO-VYl6dHI8tkGDV7JYvFOZ_i7uw
    Payment-Create-Request:
      type: object
      title: Payment Create Request
      description: Representation of a request for a new payment
      properties:
        amount:
          type: integer
          description: 'Total amount in cents. In HUF, the amount must be a multiple of 100'
          minimum: 0
          examples:
            - 100
        currency:
          $ref: '#/components/schemas/Currency'
          description: Payment currency
        order_number:
          type: string
          description: 'Order identification for the online shop, alphanumeric characters'
          maxLength: 128
          examples:
            - '2025010199'
        order_description:
          type: string
          description: 'Order description, alphanumeric characters'
          examples:
            - Test order
        additional_params:
          type: array
          description: Additional parameters for the payment
          maxItems: 4
          items:
            $ref: '#/components/schemas/Additional-Param'
          examples:
            - - name: Custom param
                value: Custom value
        customer:
          $ref: '#/components/schemas/Customer'
          description: Information about the customer
        callback:
          $ref: '#/components/schemas/Payment-Callback'
          description: URLs for the return redirect and the notifications
      required:
        - amount
        - currency
        - order_number
        - customer
        - callback
      examples:
        - amount: 100
          currency: CZK
          order_number: '2025010199'
          order_description: Test order
          additional_params:
            - name: Custom param
              value: Custom value
          customer:
            email: john.doe@example.com
            first_name: John
            last_name: Doe
            phone_number: '+420123456789'
            city: Testington
            street: Example st. 10
            postal_code: '10000'
            country_code: CZE
            customer_id: customer420
          callback:
            notification_url: 'https://example.com/notify'
            return_url: 'https://example.com/return'
    Currency:
      type: string
      enum:
        - CZK
        - EUR
        - PLN
        - USD
        - GBP
        - HUF
        - RON
      description: Supported payment currencies in ISO 4217 format
      examples:
        - CZK
    Additional-Param:
      type: object
      title: Additional Parameter
      description: Additional payment parameters
      properties:
        name:
          type: string
          description: Parameter name
          examples:
            - Custom param
        value:
          type: string
          description: Parameter value
          examples:
            - Custom value
      required:
        - name
        - value
      examples:
        - name: Custom param
          value: Custom value
    Payment-Details:
      type: object
      title: Payment Details
      description: Representation of an existing payment
      required:
        - id
        - order_number
        - state
        - amount
        - currency
        - customer
        - gw_url
        - payment_secret
      properties:
        id:
          type: string
          description: Identifier of the payment
          examples:
            - '300000001'
        order_number:
          type: string
          description: Order number given when the payment was created
          examples:
            - '2025010199'
        state:
          $ref: '#/components/schemas/Payment-State'
          description: Payment state
        amount:
          type: integer
          description: |
            Total amount in cents
          examples:
            - 100
        currency:
          $ref: '#/components/schemas/Currency'
          description: |
            Payment currency
        customer:
          $ref: '#/components/schemas/Customer'
          description: Customer data
        gw_url:
          type: string
          description: |
            Address of GoPay's hosted payment gateway for this payment, used by the Redirect
            integration. It offers the customer every payment method the eshop has enabled,
            and GoPay drives the payment while the customer is on it. It is a destination the
            customer is sent to and cannot be embedded in the merchant's own checkout.
            `GET /payments/{payment_id}` reports the outcome of a payment paid there in the
            same way as for any other payment.
          format: uri
          examples:
            - 'https://gate.gopay.com/gw/123456789'
        charge:
          $ref: '#/components/schemas/Payment-Charge-Status-Response'
          description: The payment's charge, once a charge has been attempted
        payment_secret:
          type: string
          description: 'Payment secret that the merchant''s server passes to the GoPay client SDK, so that the SDK can act on this payment. **Do not embed in URLs, log or store!**'
          examples:
            - ps_4d2f9a51b7e30c68a1c5e9f03b7d2e46
    Customer:
      type: object
      description: Customer details associated with the payment. The email address is required as it is used for authentication and notification purposes.
      properties:
        email:
          type: string
          description: Customer email
          format: email
          maxLength: 128
          examples:
            - john.doe@example.com
        first_name:
          type: string
          description: Customer first name
          maxLength: 256
          examples:
            - John
        last_name:
          type: string
          description: Customer last name
          maxLength: 256
          examples:
            - Doe
        phone_number:
          type: string
          description: Customer phone number (home or mobile)
          maxLength: 128
          examples:
            - '+420123456789'
        city:
          type: string
          description: Customer address city
          maxLength: 128
          examples:
            - Testington
        street:
          type: string
          description: Customer address street
          maxLength: 128
          examples:
            - Example st. 10
        postal_code:
          type: string
          description: Customer address ZIP (postal code)
          maxLength: 128
          examples:
            - '10000'
        country_code:
          type: string
          description: 'Customer country code according to [ISO 3166-1 alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)'
          maxLength: 128
          examples:
            - CZE
        customer_id:
          type: string
          description: Unique customer ID (used to customise the checkout experience)
          maxLength: 128
          examples:
            - customer420
      required:
        - email
      examples:
        - email: john.doe@example.com
          first_name: John
          last_name: Doe
          phone_number: '+420123456789'
          city: Testington
          street: Example st. 10
          postal_code: '10000'
          country_code: CZE
          customer_id: customer420
      x-examples:
        Example 1:
          first_name: John
          last_name: Doe
          email: john.doe@example.com
          phone_number: '+420123456789'
          city: Testington
          street: Example st. 10
          postal_code: '10000'
          country_code: CZE
          customer_id: customer420
      title: Customer
    Payment-Callback:
      type: object
      title: Payment Callback
      description: Object holding URLs for callback purposes related to a payment
      properties:
        notification_url:
          type: string
          description: >-
            URL that receives notifications about the payment. Optional: when it is omitted, notifications go
            to the notification URL configured for the eshop, and an eshop with none configured receives no
            notification. When present, it must not be empty
          examples:
            - 'https://example.com/notify'
        return_url:
          type: string
          description: 'URL the customer''s browser is sent to at the end of the hosted gateway flow, and after the 3-D Secure step in a checkout integration. It must not carry a fragment (`#…`)'
          examples:
            - 'https://example.com/return'
      required:
        - return_url
      examples:
        - notification_url: 'https://example.com/notify'
          return_url: 'https://example.com/return'
    Payment-State:
      type: string
      enum:
        - CREATED
        - PAID
        - CANCELED
        - PAYMENT_METHOD_CHOSEN
        - TIMEOUTED
        - AUTHORIZED
        - REFUNDED
        - PARTIALLY_REFUNDED
      description: |-
        The lifecycle state of a payment.
        - `CREATED` - The payment exists and is awaiting a charge attempt
        - `PAID` - The payment was charged successfully
        - `CANCELED` - The customer abandoned the payment, the charge was rejected at authorisation, or the merchant canceled the payment before it was charged
        - `PAYMENT_METHOD_CHOSEN` - A charge attempt is in flight and its outcome is not known yet
        - `TIMEOUTED` - The payment did not reach a terminal outcome within its timeout
        - `AUTHORIZED` - The payment has been authorised but not yet captured; only relevant for the pre-authorisation flow
        - `REFUNDED` - The payment has been fully refunded
        - `PARTIALLY_REFUNDED` - The payment has been partially refunded
      examples:
        - CREATED
      title: Payment State
    Charge-State:
      type: string
      enum:
        - REQUESTED
        - PROCESSING
        - ACTION_REQUIRED
        - SUCCEEDED
        - FAILED
      title: Charge State
      description: |-
        The lifecycle state of a payment charge.
        - `REQUESTED` - The charge has been initiated
        - `PROCESSING` - The charge is being processed by the payment provider
        - `ACTION_REQUIRED` - The customer must complete a step, such as 3-D Secure authentication, before the charge can continue
        - `SUCCEEDED` - The charge completed successfully
        - `FAILED` - The charge failed
      examples:
        - REQUESTED
    Payment-Charge-Data:
      title: Payment Charge Data
      description: 'The payment instrument used for the charge. The `payment_instrument` field selects the case, taking values from the [Payment Instrument](#/schemas/Payment-Instrument) enum.'
      oneOf:
        - $ref: '#/components/schemas/Payment-Card-Charge-Data'
      discriminator:
        propertyName: payment_instrument
        mapping:
          PAYMENT_CARD: '#/components/schemas/Payment-Card-Charge-Data'
    Payment-Charge-Input:
      type: object
      title: Payment Charge Input
      description: Model holding all data necessary to perform a payment charge
      required:
        - payment_instrument
      properties:
        payment_instrument:
          $ref: '#/components/schemas/Payment-Charge-Data'
          description: Payment instrument data specifying how the payment should be charged
    Payment-Instrument:
      type: string
      enum:
        - PAYMENT_CARD
      title: Payment Instrument
      description: 'The values of the field that selects the case of [Payment Charge Data](#/schemas/Payment-Charge-Data)'
    Payment-Card-Charge-Data:
      type: object
      title: Payment Card Charge Data
      description: 'The `PAYMENT_CARD` variant of the [Payment Charge Data](#/schemas/Payment-Charge-Data) union. Holds the card input, the browser data and the 3-D Secure preference.'
      required:
        - payment_instrument
        - input
        - browser_data
      properties:
        payment_instrument:
          const: PAYMENT_CARD
          type: string
          description: Always `PAYMENT_CARD`
        input:
          $ref: '#/components/schemas/Payment-Card-Input'
          description: One of the possible inputs for a card payment
        browser_data:
          $ref: '#/components/schemas/Browser-Data'
        challenge_preference:
          $ref: '#/components/schemas/Payment-Card-Challenge-Preference'
    Payment-Card-Input:
      title: Payment Card Input
      description: 'The card the payment is charged with. The `input_type` field selects the case, taking values from the [Payment Card Input Type](#/schemas/Payment-Card-Input-Type) enum.'
      oneOf:
        - $ref: '#/components/schemas/Card-Token-Input'
        - $ref: '#/components/schemas/Google-Pay-Input'
        - $ref: '#/components/schemas/Apple-Pay-Input'
        - $ref: '#/components/schemas/Encrypted-Card-Input'
      discriminator:
        propertyName: input_type
        mapping:
          CARD_TOKEN: '#/components/schemas/Card-Token-Input'
          GOOGLE_PAY: '#/components/schemas/Google-Pay-Input'
          APPLE_PAY: '#/components/schemas/Apple-Pay-Input'
          ENCRYPTED_CARD: '#/components/schemas/Encrypted-Card-Input'
    Payment-Card-Input-Type:
      type: string
      enum:
        - CARD_TOKEN
        - APPLE_PAY
        - GOOGLE_PAY
        - ENCRYPTED_CARD
      title: Payment Card Input Type
      description: 'The values of the field that selects the case of [Payment Card Input](#/schemas/Payment-Card-Input)'
    Card-Token-Input:
      type: object
      title: Card Token Input
      description: 'The `CARD_TOKEN` variant of the [Payment Card Input](#/schemas/Payment-Card-Input) union. Carries a saved card token'
      required:
        - input_type
        - card_token
      properties:
        input_type:
          const: CARD_TOKEN
          type: string
          description: Always `CARD_TOKEN`
        card_token:
          type: string
          description: 'Permanent card token acquired using the [Create Card Token](#/operations/post-cards-tokens) API call'
          examples:
            - J7HjFNwzyBOHS+jwIMMktubTwoIRy6qB/4opvjG...
    Payment-Card-Challenge-Preference:
      type: string
      enum:
        - CHALLENGE_PREFERRED
        - NO_CHALLENGE_PREFERRED
        - AUTO
      title: Payment Card Challenge Preference
      description: |-
        The merchant's preference for the 3-D Secure authentication of a card payment.
        - `AUTO` - let GoPay decide
        - `CHALLENGE_PREFERRED` - ask for a 3-D Secure challenge for stronger authentication; it may still be skipped, for example for Apple Pay
        - `NO_CHALLENGE_PREFERRED` - ask to skip the challenge; the card issuer can still require one
      examples:
        - AUTO
    Google-Pay-Input:
      type: object
      additionalProperties: true
      title: Google Pay Input
      description: |-
        The `GOOGLE_PAY` variant of the [Payment Card Input](#/schemas/Payment-Card-Input) union. Carries the payment data returned by Google Pay.
        See [Payment Data Cryptography](https://developers.google.com/pay/api/web/guides/resources/payment-data-cryptography) in Google Pay documentation for details.
      properties:
        input_type:
          const: GOOGLE_PAY
          type: string
          description: Always `GOOGLE_PAY`
          examples:
            - GOOGLE_PAY
        protocolVersion:
          type: string
          description: Version of the Google Pay API protocol used to encrypt the payment data
          examples:
            - ECv2
        signature:
          type: string
          description: Digital signature of the payment data
          examples:
            - MEQCIH6Q4OwQ0jAceFEkGF0JID6sJNXxOEi4r+mA7biRxqBQAiAondqoUpU/bdsrAOpZIsrHQS9nwiiNwOrr24RyPeHA0Q==
        intermediateSigningKey:
          type: object
          description: Intermediate signing key from Google used to verify the signature
          properties:
            signedKey:
              type: string
              description: JSON-encoded string containing the key value and expiration
              examples:
                - '{"keyExpiration":"1542323393147","keyValue":"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE/1+3HBVSbdv+j7NaArdgMyoSAM43yRydzqdg1TxodSzA96Dj4Mc1EiKroxxunavVIvdxGnJeFViTzFvzFRxyCw=="}'
            signatures:
              type: array
              description: Signatures of the intermediate signing key
              examples:
                - - MEYCIQCO2EIi48s8VTH+ilMEpoXLFfkxAwHjfPSCVED/QDSHmQIhALLJmrUlNAY8hDQRV/y1iKZGsWpeNmIP+z+tCQHQxP0v
              items:
                type: string
                examples:
                  - MEYCIQCO2EIi48s8VTH+ilMEpoXLFfkxAwHjfPSCVED/QDSHmQIhALLJmrUlNAY8hDQRV/y1iKZGsWpeNmIP+z+tCQHQxP0v
          examples:
            - signedKey: '{"keyExpiration":"1542323393147","keyValue":"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE/1+3HBVSbdv+j7NaArdgMyoSAM43yRydzqdg1TxodSzA96Dj4Mc1EiKroxxunavVIvdxGnJeFViTzFvzFRxyCw=="}'
              signatures:
                - MEYCIQCO2EIi48s8VTH+ilMEpoXLFfkxAwHjfPSCVED/QDSHmQIhALLJmrUlNAY8hDQRV/y1iKZGsWpeNmIP+z+tCQHQxP0v
        signedMessage:
          type: string
          description: JSON-encoded string containing the encrypted payment data
          examples:
            - '{"tag":"jpGz1F1Bcoi/fCNxI9n7Qrsw7i7KHrGtTf3NrRclt+U=","ephemeralPublicKey":"BJatyFvFPPD21l8/uLP46Ta1hsKHndf8Z+tAgk+DEPQgYTkhHy19cF3h/bXs0tWTmZtnNm+vlVrKbRU9K8+7cZs=","encryptedMessage":"mKOoXwi8OavZ"}'
    Apple-Pay-Input:
      type: object
      additionalProperties: true
      title: Apple Pay Input
      description: |-
        The `APPLE_PAY` variant of the [Payment Card Input](#/schemas/Payment-Card-Input) union. Carries the payment token returned by Apple Pay.
        See [Payment token format reference](https://developer.apple.com/documentation/passkit/payment-token-format-reference) in the Apple Pay documentation for details.
      properties:
        input_type:
          const: APPLE_PAY
          type: string
          description: Always `APPLE_PAY`
          examples:
            - APPLE_PAY
        data:
          type: string
          description: Encrypted payment data from the Apple Pay token
          examples:
            - V7OcjttPJnUJaQH7x7OjbIeZSINuc...
        signature:
          type: string
          description: 'Signature of the payment and header data, signed by Apple'
          examples:
            - MIAGCSqGSIb3DQEHAqCAM...
        version:
          type: string
          description: Version of the Apple Pay payment token format
          examples:
            - EC_v1
        header:
          type: object
          additionalProperties: true
          description: Header containing additional data for decrypting and verifying the payment token
          properties:
            applicationData:
              type: string
              description: 'Hash of the `applicationData` carried on the Apple Pay payment request. Apple includes it only for sessions created with that value, so the field is optional; forward it unchanged when the Apple Pay session returns it'
              examples:
                - 94ee059335e587e5f6b717fb172c5c3841659d892a84b7c6c47d0d13c58f7ea4
            ephemeralPublicKey:
              type: string
              description: Ephemeral public key used for deriving the shared secret
              examples:
                - MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwpd0HT6uOdE2pZTBZXsJF7IK7EvJQDq4LnQS5B5g8fiD9sEZNt4P9DhWRO44kEbbyiQ1FVgPcSsvJ2Z5I+qPTw==
            publicKeyHash:
              type: string
              description: SHA-256 hash of the merchant's public key certificate
              examples:
                - L6vppo38t31Q/9npxRy/xbA1+cs13h1LV+pMO/FYwvo=
            transactionId:
              type: string
              description: Unique transaction identifier generated by Apple Pay
              examples:
                - 4f4fac7a179ae30ce4c839e85efa4a34811a5ea2af88280c847a6a8ba2c0e8c5
          required:
            - ephemeralPublicKey
            - publicKeyHash
            - transactionId
          examples:
            - applicationData: 94ee059335e587e5f6b717fb172c5c3841659d892a84b7c6c47d0d13c58f7ea4
              ephemeralPublicKey: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwpd0HT6uOdE2pZTBZXsJF7IK7EvJQDq4LnQS5B5g8fiD9sEZNt4P9DhWRO44kEbbyiQ1FVgPcSsvJ2Z5I+qPTw==
              publicKeyHash: L6vppo38t31Q/9npxRy/xbA1+cs13h1LV+pMO/FYwvo=
              transactionId: 4f4fac7a179ae30ce4c839e85efa4a34811a5ea2af88280c847a6a8ba2c0e8c5
      required:
        - input_type
        - data
        - signature
        - version
        - header
      examples:
        - input_type: APPLE_PAY
          data: V7OcjttPJnUJaQH7x7OjbIeZSINuc...
          signature: MIAGCSqGSIb3DQEHAqCAM...
          version: EC_v1
          header:
            applicationData: 94ee059335e587e5f6b717fb172c5c3841659d892a84b7c6c47d0d13c58f7ea4
            ephemeralPublicKey: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEwpd0HT6uOdE2pZTBZXsJF7IK7EvJQDq4LnQS5B5g8fiD9sEZNt4P9DhWRO44kEbbyiQ1FVgPcSsvJ2Z5I+qPTw==
            publicKeyHash: L6vppo38t31Q/9npxRy/xbA1+cs13h1LV+pMO/FYwvo=
            transactionId: 4f4fac7a179ae30ce4c839e85efa4a34811a5ea2af88280c847a6a8ba2c0e8c5
    Bank-Swift:
      type: string
      enum:
        - GIBACZPX
        - KOMBCZPP
        - SUBASKBX
        - GIBASKBX
        - OTHERS
      title: Bank Swift
      description: |-
        SWIFT/BIC code identifying a supported bank. Use `OTHERS` for banks not explicitly listed.
        - `GIBACZPX` - Česká spořitelna (Czech Republic)
        - `KOMBCZPP` - Komerční banka (Czech Republic)
        - `SUBASKBX` - VÚB banka (Slovakia)
        - `GIBASKBX` - Slovenská sporiteľňa (Slovakia)
        - `OTHERS` - Any other supported bank
      examples:
        - GIBACZPX
    Browser-Data:
      type: object
      title: Browser Data
      description: Customer browser data collected for 3-D Secure authentication purposes. This data is forwarded to the card issuer during the authentication flow.
      required:
        - language
        - timezone
        - screen_width
        - screen_height
        - color_depth
        - user_agent
        - accept_header
        - javascript_enabled
        - ip
      properties:
        language:
          type: string
          description: Language or locale of the customer environment
          examples:
            - cs-CZ
        timezone:
          type: integer
          description: Timezone offset of the customer environment in minutes (e.g. -60 for CET)
          examples:
            - -60
        screen_width:
          type: integer
          description: Width of the customer's screen in pixels
          examples:
            - 434
        screen_height:
          type: integer
          description: Height of the customer's screen in pixels
          examples:
            - 965
        color_depth:
          type: integer
          description: Color depth of the customer's screen in bits
          examples:
            - 24
        user_agent:
          type: string
          description: User-Agent string of the customer's browser, as returned by the browser data endpoint. Take it from the same source as `ip` — a pair that disagrees fails 3-D Secure authentication
          examples:
            - 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Mobile Safari/537.36'
        accept_header:
          type: string
          description: JSON-encoded Accept headers from the customer's browser, as returned by the browser data endpoint. Take it from the same source as `ip`
          examples:
            - '{"accept-language":"cs;q=0.5","accept-encoding":"gzip, deflate, br, zstd","accept":"application/json, text/plain, */*"}'
        javascript_enabled:
          type: boolean
          description: Whether JavaScript is enabled in the customer's browser
          examples:
            - true
        ip:
          type: string
          maxLength: 45
          description: IP address of the customer's browser, as returned by the browser data endpoint. A merchant's server charging on the customer's behalf must forward the value collected in the browser, never its own address
          examples:
            - 192.0.2.42
    Browser-Data-Detected:
      type: object
      title: Browser Data Detected
      description: |-
        The `Browser Data` fields the customer's browser cannot determine on its own, derived from the request that fetched them.
        Merge them into `Browser Data` when charging the payment.
      required:
        - ip
        - user_agent
        - accept_header
      properties:
        ip:
          type: string
          maxLength: 45
          description: IP address the request originated from
          examples:
            - 192.0.2.42
        user_agent:
          type: string
          description: User-Agent header sent with the request
          examples:
            - 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/146.0.0.0 Mobile Safari/537.36'
        accept_header:
          type: string
          description: JSON-encoded Accept headers sent with the request
          examples:
            - '{"accept-language":"cs;q=0.5","accept-encoding":"gzip, deflate, br, zstd","accept":"application/json, text/plain, */*"}'
    Payment-Charge-Response:
      type: object
      title: Payment Charge Response
      description: 'The charge started by `POST /payments/{payment_id}/charge`: its state, the instrument used, and any step the customer must complete.'
      required:
        - id
        - state
        - payment_instrument
      properties:
        id:
          type: string
          description: Unique identifier of the charge
          examples:
            - '9123456789'
        state:
          $ref: '#/components/schemas/Charge-State'
          description: Current state of the charge
        payment_instrument:
          $ref: '#/components/schemas/Payment-Instrument-Data'
          description: Details of the payment instrument used for this charge
        action:
          $ref: '#/components/schemas/Payment-Charge-Action'
          description: 'The step the customer must complete, such as 3-D Secure authentication. Present when `state` is `ACTION_REQUIRED`'
    Payment-Charge-Status-Response:
      type: object
      title: Payment Charge Status Response
      description: 'The current state of the payment''s charge, the instrument used, any step the customer must complete and, for a failed charge, the reason.'
      required:
        - id
        - state
      properties:
        id:
          type: string
          description: Unique identifier of the charge
          examples:
            - '9123456789'
        state:
          $ref: '#/components/schemas/Charge-State'
          description: Current state of the charge
        payment_instrument:
          $ref: '#/components/schemas/Payment-Instrument-Data'
          description: Details of the payment instrument used for this charge
        action:
          $ref: '#/components/schemas/Payment-Charge-Action'
          description: 'The step the customer must complete, such as 3-D Secure authentication. Present when `state` is `ACTION_REQUIRED`'
        fail_reason:
          type: string
          description: Reason for the charge's failure. Only present when state is `FAILED`
          examples:
            - Issuer declined the authorisation
    Payment-Instrument-Data:
      title: Payment Instrument Data
      description: 'The payment instrument a charge used. The `payment_instrument` field selects the case, taking values from the [Payment Instrument](#/schemas/Payment-Instrument) enum.'
      examples:
        - payment_instrument: PAYMENT_CARD
          details:
            input_type: CARD_TOKEN
            masked_pan: 406821******1234
            expiration_month: '01'
            expiration_year: '30'
            scheme: VISA
            fingerprint: 73c8d0a48d91def89761...
      oneOf:
        - $ref: '#/components/schemas/Payment-Card-Instrument-Out'
      discriminator:
        propertyName: payment_instrument
        mapping:
          PAYMENT_CARD: '#/components/schemas/Payment-Card-Instrument-Out'
    Payment-Card-Instrument-Out:
      type: object
      title: Payment Card Instrument Out
      description: The `PAYMENT_CARD` variant of the Payment Instrument Data union. Contains the card-specific details of the instrument used in a charge.
      examples:
        - payment_instrument: PAYMENT_CARD
          details:
            input_type: CARD_TOKEN
            masked_pan: 406821******1234
            expiration_month: '01'
            expiration_year: '30'
            scheme: VISA
            fingerprint: 73c8d0a48d91def89761...
      required:
        - payment_instrument
      properties:
        payment_instrument:
          $ref: '#/components/schemas/Payment-Instrument'
          description: Always `PAYMENT_CARD`
        details:
          $ref: '#/components/schemas/Payment-Card-Charge-Details'
          description: Card-specific details of the payment instrument
    Payment-Card-Charge-Details:
      type: object
      title: Payment Card Charge Details
      description: Output details of a card payment instrument as returned in a charge response. Contains masked card data identifying the card used.
      examples:
        - input_type: CARD_TOKEN
          masked_pan: 406821******1234
          expiration_month: '01'
          expiration_year: '30'
          scheme: VISA
          fingerprint: 73c8d0a48d91def89761...
      required:
        - input_type
      properties:
        input_type:
          $ref: '#/components/schemas/Payment-Card-Input-Type'
          description: The type of card input that was used for the charge
        masked_pan:
          type: string
          description: Masked primary account number with only the first six and last four digits visible
          examples:
            - 406821******1234
        expiration_month:
          type: string
          description: Card expiration month (01–12)
          pattern: '^(?:0[0-9]|1[0-2])$'
          examples:
            - '01'
        expiration_year:
          type: string
          description: Card expiration year (two-digit format)
          pattern: '^[0-9]{2}$'
          examples:
            - '30'
        scheme:
          $ref: '#/components/schemas/Card-scheme'
          description: Card network scheme
        fingerprint:
          type: string
          description: A unique hash identifying the physical card
          examples:
            - 73c8d0a48d91def89761...
    Card-scheme:
      type: string
      enum:
        - VISA
        - MASTERCARD
      title: Card Scheme
      description: The card network scheme (VISA or MASTERCARD)
      examples:
        - VISA
    Payment-Charge-Action:
      title: Payment Charge Action
      description: 'A step the customer must complete before the charge can continue, such as 3-D Secure authentication on the card issuer''s page. The `action_type` field selects the case.'
      examples:
        - action_type: EMV3DS
          state: CREATED
          redirect_url: 'https://gate.gopay.com/redirect'
      oneOf:
        - $ref: '#/components/schemas/Emv-3DS-Action'
      discriminator:
        propertyName: action_type
        mapping:
          EMV3DS: '#/components/schemas/Emv-3DS-Action'
      type: object
    Payment-Charge-Action-Type:
      type: string
      enum:
        - EMV3DS
      title: Payment Charge Action Type
      description: |-
        The values of the field that selects the case of Payment Charge Action.
        - `EMV3DS` - EMV 3-D Secure authentication for card payments
      examples:
        - EMV3DS
    Emv-3DS-Action:
      type: object
      title: Emv 3DS Action
      description: The `EMV3DS` variant of the Payment Charge Action union. Represents an EMV 3-D Secure authentication action for card payments.
      examples:
        - action_type: EMV3DS
          state: CREATED
          redirect_url: 'https://gate.gopay.com/redirect'
      required:
        - action_type
        - state
      properties:
        action_type:
          $ref: '#/components/schemas/Payment-Charge-Action-Type'
          description: Always `EMV3DS`
        state:
          $ref: '#/components/schemas/Emv-3DS-State'
          description: Current state of the 3-D Secure authentication
        redirect_url:
          type: string
          description: 'URL the customer''s browser is sent to for the 3-D Secure step. Present while the charge is in `ACTION_REQUIRED`'
          examples:
            - 'https://gate.gopay.com/redirect'
          format: uri
    Emv-3DS-State:
      type: string
      enum:
        - CREATED
        - CHALLENGE_REQUIRED
        - AUTHENTICATED_CHALLENGE
        - AUTHENTICATED_FRICTIONLESS
        - NOT_AUTHENTICATED
        - FAILED
      title: Emv 3DS State
      description: |-
        The lifecycle state of an EMV 3-D Secure authentication.
        - `CREATED` - The 3-D Secure authentication has been initiated
        - `CHALLENGE_REQUIRED` - The customer must complete a 3-D Secure challenge, such as a one-time code or a confirmation in the banking app
        - `AUTHENTICATED_CHALLENGE` - The customer was authenticated through a challenge
        - `AUTHENTICATED_FRICTIONLESS` - The customer was authenticated without a challenge (frictionless flow)
        - `NOT_AUTHENTICATED` - The 3-D Secure authentication was not completed
        - `FAILED` - The 3-D Secure authentication failed
      examples:
        - CREATED
    QR-Payment-Details:
      type: object
      title: QR Payment Details
      description: 'Details of a QR code payment including the payment amount, recipient bank account information, and the generated QR codes in various formats.'
      properties:
        amount:
          type: integer
          description: Payment amount in cents
          examples:
            - 10000
        currency:
          $ref: '#/components/schemas/Currency'
          description: Payment currency
        recipient:
          $ref: '#/components/schemas/Bank-Transfer-Recipient'
          description: Information about the recipient
        qr_code:
          $ref: '#/components/schemas/QR-Code-List'
          description: Generated QR code images in various regional formats
      required:
        - amount
        - currency
        - recipient
        - qr_code
    Bank-Transfer-Recipient:
      type: object
      title: Bank Transfer Recipient
      description: 'Information about the recipient of a bank transfer payment, including their name, bank account details, and address.'
      properties:
        name:
          type: string
          description: Name of the payment recipient
          examples:
            - GoPay Czech
        bank_account:
          $ref: '#/components/schemas/Recipient-Bank-Account'
          description: Bank account details of the recipient in both local and international formats
        address:
          $ref: '#/components/schemas/Recipient-Address'
          description: Physical address of the recipient
    Recipient-Bank-Account:
      type: object
      title: Recipient Bank Account
      description: Recipient bank account details provided in both local (country-specific) and international (IBAN/SWIFT) formats.
      properties:
        local:
          $ref: '#/components/schemas/Bank-Account-Local-Details'
          description: Bank account details in the local (country-specific) format
        international:
          $ref: '#/components/schemas/Bank-Account-International-Details'
          description: Bank account details in the international IBAN/BIC format
    Bank-Account-Local-Details:
      type: object
      title: Bank Account Local Details
      description: 'Bank account details in the local Czech/Slovak format, including the account number prefix, bank code, and variable symbol for payment identification.'
      properties:
        prefix:
          type: string
          description: Account number prefix (may be all zeros)
          examples:
            - '000000'
        account_number:
          type: string
          description: The local bank account number
          examples:
            - '9878039'
        bank_code:
          type: string
          description: Numeric bank code identifying the bank
          examples:
            - '2010'
        variable_symbol:
          type: string
          description: Variable symbol used to match the payment to an order
          examples:
            - '3123456789'
      required:
        - prefix
        - account_number
        - bank_code
        - variable_symbol
      x-examples:
        Example 1:
          prefix: '000000'
          account_number: '9878039'
          bank_code: '2010'
          variable_symbol: '3123456789'
    Bank-Account-International-Details:
      type: object
      title: Bank Account International Details
      description: 'Bank account details in the international IBAN/BIC format, used for cross-border and SEPA payments.'
      x-examples:
        Example 1:
          bic: FIOBCZPP
          iban: CZ5120100000000009878039
          reference: '3123456789'
      properties:
        bic:
          $ref: '#/components/schemas/Bank-Swift'
          description: BIC (Bank Identifier Code) / SWIFT code of the bank
        iban:
          type: string
          description: International Bank Account Number
          examples:
            - CZ5120100000000009878039
        reference:
          type: string
          description: Payment reference number used to match the payment to an order
          examples:
            - '3123456789'
    Recipient-Address:
      type: object
      title: Recipient Address
      description: Physical address of the payment recipient.
      properties:
        street:
          type: string
          description: Street address including the building number
          examples:
            - Senovazne nam. 1736
        city:
          type: string
          description: City name
          examples:
            - Ceske Budejovice
        zip_code:
          type: string
          description: ZIP or postal code
          examples:
            - '37001'
        country:
          type: string
          description: Country name
          examples:
            - Czech Republic
      x-examples:
        Example 1:
          street: Senovazne nam. 1736
          city: Ceske Budejovice
          zip_code: '37001'
          country: Czech Republic
    QR-Code-List:
      type: object
      title: QR Code List
      description: 'A collection of QR code images in various regional formats, each encoded as a base64 string. The available formats depend on the payment currency and recipient country.'
      properties:
        spayd:
          type: string
          description: 'QR code in the SPAYD (Short Payment Descriptor) format, commonly used in the Czech Republic. Encoded as a base64 image in the requested format.'
          examples:
            - 
        paybysquare:
          type: string
          description: 'QR code in the Pay by Square format, commonly used in Slovakia. Encoded as a base64 image in the requested format.'
          examples:
            - '{QR code in base64}'
        sepa:
          type: string
          description: QR code in the SEPA (Single Euro Payments Area) format for EUR payments. Encoded as a base64 image in the requested format.
          examples:
            - '{QR code in base64}'
        mnb_qr:
          type: string
          description: 'QR code in the MNB (Magyar Nemzeti Bank) format, commonly used in Hungary. Encoded as a base64 image in the requested format.'
          examples:
            - '{QR code in base64}'
    Token-Create-Request:
      type: object
      title: Token Create Request
      description: Request body for creating a card token. Contains the encrypted card data.
      required:
        - payload
      properties:
        payload:
          $ref: '#/components/schemas/JWE'
          description: The encrypted card data payload in JWE compact serialization format
    Permanent-Card-Token-Details:
      type: object
      title: Permanent Card Token Details
      description: Details of a saved card token. The token is reused on later charges until it is deleted; issuer updates such as a new expiration date are applied to it in place.
      properties:
        card_id:
          type: string
          description: Unique identifier of the stored card token
          examples:
            - '8007127320'
        masked_pan:
          type: string
          description: Masked primary account number with only the first six and last four digits visible
          examples:
            - 406821******1234
        masked_virtual_pan:
          type: string
          description: Masked virtual PAN (network token) associated with the card
          examples:
            - 489537******6287
        expiration_month:
          type: string
          description: Card expiration month (01–12)
          pattern: '^(?:0[0-9]|1[0-2])$'
          examples:
            - '01'
        expiration_year:
          type: string
          description: Card expiration year (two-digit format)
          pattern: '^[0-9]{2}$'
          examples:
            - '30'
        scheme:
          $ref: '#/components/schemas/Card-scheme'
          description: Card network scheme
        corporate:
          type: boolean
          description: Whether the card is a corporate (business) card
          default: false
          examples:
            - false
        fingerprint:
          type: string
          description: 'A unique hash identifying the physical card, stable across repeated tokenisations of the same card'
          examples:
            - 73c8d0a48d91def897612b54e630997745e1faad43045e732189cfe4acf4961b
        token:
          type: string
          description: The permanent card token value to be used in charge requests
          examples:
            - J7HjFNwzyBOHS+jwIMMktubTwoIRy6qB/4opvjGcKtjv9DtCT3HLSlWHRYAbVTBLbouV77YtVSgavhi4uRZTwDy218Gog4MbZJ+umL/BkfFlNQ80PCdOjwYr8DtqZr71LHwkvg91ywirZp0=
        card_art_url:
          type: string
          description: URL of the card art image provided by the issuing bank
          format: uri
          examples:
            - 'https://card.art/pic.png'
        brand:
          type: string
          description: 'Card brand or tier (e.g. GOLD, PLATINUM, STANDARD)'
          examples:
            - GOLD
        service_type:
          $ref: '#/components/schemas/Card-Service-Type'
          description: Whether the card is a debit or credit card
        status:
          $ref: '#/components/schemas/Card-Token-Status'
          description: Current status of the stored card token
      required:
        - card_id
        - masked_pan
        - masked_virtual_pan
        - expiration_month
        - expiration_year
        - scheme
        - corporate
        - fingerprint
        - token
        - card_art_url
      examples:
        - card_id: '8007127320'
          masked_pan: 406821******1234
          masked_virtual_pan: 489537******6287
          expiration_month: '01'
          expiration_year: '30'
          scheme: VISA
          corporate: false
          fingerprint: 73c8d0a48d91def897612b54e630997745e1faad43045e732189cfe4acf4961b
          token: J7HjFNwzyBOHS+jwIMMktubTwoIRy6qB/4opvjGcKtjv9DtCT3HLSlWHRYAbVTBLbouV77YtVSgavhi4uRZTwDy218Gog4MbZJ+umL/BkfFlNQ80PCdOjwYr8DtqZr71LHwkvg91ywirZp0=
          card_art_url: 'https://card.art/pic.png'
          brand: GOLD
          service_type: DEBIT
    Card-Service-Type:
      type: string
      enum:
        - DEBIT
        - CREDIT
      title: Card Service Type
      description: |-
        Indicates whether the card is a debit or credit card.
        - `DEBIT` - Funds are drawn directly from the cardholder's bank account
        - `CREDIT` - Funds are drawn from the cardholder's credit line
      examples:
        - DEBIT
    Card-Token-Status:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - DELETED
      title: Card Token Status
      description: |-
        Current status of a permanent card token.
        - `ACTIVE` - The token is valid and can be used for payments
        - `SUSPENDED` - The token is temporarily suspended and cannot be used
        - `DELETED` - The token has been permanently deleted
      examples:
        - ACTIVE
    JWK:
      type: object
      title: JWK
      description: 'The structure of the public encryption key. It is formatted according to RFC 7517: JSON Web Key (JWK)'
      properties:
        kty:
          const: RSA
          description: Key type. Always `RSA` for the encryption keys used by GoPay.
          examples:
            - RSA
        use:
          const: enc
          description: Key usage. Always `enc` (encryption).
          examples:
            - enc
        kid:
          type: string
          description: Key ID
          examples:
            - key_20250406
        alg:
          type: string
          description: Algorithm to be used for encryption with the key.
          default: RSA-OAEP-256
          examples:
            - RSA-OAEP-256
        'n':
          type: string
          description: The `RSA` public key modulus part.
          examples:
            - oR79tj1xAaqr1TfmkGS03EfEZjU_5DMomKJXGK8cnmtGivG5XnFodcbztzSOrlrKmhoxrKRR0LiRRjYJIgTP3dGK9KOv7JRH4adnDClckQkxupwoz1dcm6cLDzjuVS1a4et8lQlwYKm5r52fG9VShckwNZgvmK0uYcE7717wLkX3JM2vA_F_-2oRCjG3l2E4cjhQzzstTFPkW35ZjuKut4If8LOnKH0h9tdblUOSB_VtZBNY6PCXeUTDfbCb85-eGrwWXEajq4uegPDbV2oSnTLxOXR8ctWURZ8XjS1PgsoDD4go9BQchv-9Q2m0NbS5s71WVJ9LOW7Xt-Napsoftw
        e:
          type: string
          description: The `RSA` public key exponent part.
          default: AQAB
          examples:
            - AQAB
      required:
        - kty
        - use
        - kid
        - alg
        - 'n'
        - e
      examples:
        - kty: RSA
          kid: key_20250406
          use: enc
          alg: RSA-OAEP-256
          'n': oR79tj1xAaqr1TfmkGS03EfEZjU_5DMomKJXGK8cnmtGivG5XnFodcbztzSOrlrKmhoxrKRR0LiRRjYJIgTP3dGK9KOv7JRH4adnDClckQkxupwoz1dcm6cLDzjuVS1a4et8lQlwYKm5r52fG9VShckwNZgvmK0uYcE7717wLkX3JM2vA_F_-2oRCjG3l2E4cjhQzzstTFPkW35ZjuKut4If8LOnKH0h9tdblUOSB_VtZBNY6PCXeUTDfbCb85-eGrwWXEajq4uegPDbV2oSnTLxOXR8ctWURZ8XjS1PgsoDD4go9BQchv-9Q2m0NbS5s71WVJ9LOW7Xt-Napsoftw
          e: AQAB
    JWE:
      type: string
      title: JWE
      description: |-
        The structure containing the encrypted payload. It is described by [RFC 7516: JSON Web Encryption (JWE)](https://datatracker.ietf.org/doc/html/rfc7516)

        It is produced by the GoPay client SDK.
      examples:
        - eyJhbGciOiJSU0EtT0FFUC0yNTYiLCJlbmMiOiJBMjU2R0NNIiwia2lkIjoia2V5XzIwMjUwNDA2In0.aG93ZGlkYmFzZTY0.dGhpc2lzdGhlaXY.ZW5jcnlwdGVkY2FyZGhvbGRlcmRhdGE.YXV0aHRhZw
    Card-Form-URL:
      type: object
      title: Card Form URL
      description: The URL of the hosted card input form, which the GoPay browser SDK embeds in the merchant's page.
      properties:
        card_form_url:
          type: string
          description: URL of the hosted card input form
          examples:
            - 'https://secure.gopay.com/gp-card-comm/q/form'
      x-examples:
        Example 1:
          card_form_url: 'https://secure.gopay.com/gp-card-comm/q/form'
    Error-Response-Body:
      type: object
      title: Error Response Body
      description: 'Standard error response body returned for all API error responses. Contains the HTTP status code, error type, a human-readable message, and additional diagnostic details.'
      required:
        - code
        - error
        - message
        - detail
        - path
        - timestamp
      properties:
        code:
          description: HTTP status code
          examples:
            - 400
          type: integer
        error:
          description: Error type
          examples:
            - BAD_REQUEST
          type: string
        message:
          type: string
          description: Error message
          examples:
            - Invalid request parameter
        detail:
          type: string
          description: Detailed error description
          examples:
            - 'The field `payment_instrument` is required'
        path:
          type: string
          description: Request path
          examples:
            - /payments/123/charge
        timestamp:
          type: string
          description: Error timestamp
          format: date-time
          examples:
            - '2025-12-10T10:30:00Z'
    Encrypted-Card-Input:
      title: Encrypted Card Input
      description: 'The `ENCRYPTED_CARD` variant of the [Payment Card Input](#/schemas/Payment-Card-Input) union. Carries a card the customer entered, encrypted by the GoPay client SDK. Single-use and valid for ten minutes.'
      type: object
      required:
        - input_type
        - payload
      properties:
        input_type:
          const: ENCRYPTED_CARD
          type: string
          description: Always `ENCRYPTED_CARD`
          examples:
            - ENCRYPTED_CARD
        payload:
          $ref: '#/components/schemas/JWE'
          description: The encrypted card
    Refund-Create-Request:
      title: Refund Create Request
      description: The amount to refund from a paid payment
      type: object
      required:
        - amount
      properties:
        amount:
          type: integer
          description: 'Amount to be refunded in cents. For a full amount, set it equal to the payment amount. In HUF, the amount must be a multiple of 100'
          minimum: 1
          examples:
            - 100
    Refund-Details:
      title: Refund Details
      description: A refund issued against a payment
      type: object
      required:
        - id
        - state
        - amount
        - currency
        - created_at
      properties:
        id:
          type: string
          description: Refund ID
          examples:
            - '3050123456'
        state:
          $ref: '#/components/schemas/Refund-State'
          description: Refund state
        amount:
          type: integer
          description: Refunded amount in cents
          examples:
            - 100
        currency:
          $ref: '#/components/schemas/Currency'
          description: Refund currency
        created_at:
          type: string
          format: date-time
          description: When the refund was requested
          examples:
            - '2025-12-10T10:30:00Z'
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
          description: When the refund state last changed. Null until the state changes for the first time
          examples:
            - '2025-12-10T10:35:00Z'
    Refund-State:
      type: string
      title: Refund State
      enum:
        - REQUESTED
        - SUCCESS
        - FAILED
      description: |
        Refund lifecycle state:
        - `REQUESTED` - The refund was accepted and is being processed
        - `SUCCESS` - The refund was settled
        - `FAILED` - The refund could not be processed
      examples:
        - SUCCESS
    Recurrence-Schedule:
      title: Recurrence Schedule
      type: object
      description: How often an `AUTO` recurrence creates a payment
      required:
        - period
        - cycle
      properties:
        period:
          type: string
          description: Unit the cycle is counted in
          enum:
            - DAY
            - WEEK
            - MONTH
          examples:
            - MONTH
        cycle:
          type: integer
          description: Number of periods between two payments
          minimum: 1
          examples:
            - 1
      examples:
        - period: MONTH
          cycle: 1
    Recurrence-Create-Request:
      type: object
      title: Recurrence Create Request
      description: 'One of the two recurrence kinds. The `type` field selects the case, taking values from the [Recurrence Type](#/schemas/Recurrence-Type) enum. An `AUTO` recurrence carries a `schedule`; an `ON_DEMAND` one must not, because the merchant asks for each further payment itself.'
      oneOf:
        - $ref: '#/components/schemas/Recurrence-Create-Auto'
        - $ref: '#/components/schemas/Recurrence-Create-On-Demand'
      discriminator:
        propertyName: type
        mapping:
          AUTO: '#/components/schemas/Recurrence-Create-Auto'
          ON_DEMAND: '#/components/schemas/Recurrence-Create-On-Demand'
    Recurrence-Create-Auto:
      type: object
      title: Recurrence Create Auto
      description: 'The `AUTO` variant of the [Recurrence Create Request](#/schemas/Recurrence-Create-Request) union. GoPay creates the payments itself on the schedule, so `schedule` is required here.'
      additionalProperties: false
      required:
        - type
        - schedule
        - recurrence_date_to
        - payment
      properties:
        type:
          const: AUTO
          type: string
          description: Always `AUTO`
          examples:
            - AUTO
        schedule:
          $ref: '#/components/schemas/Recurrence-Schedule'
          description: How often the recurrence creates a payment
        recurrence_date_to:
          type: string
          format: date
          description: 'Last day on which the recurrence may create a payment, as yyyy-MM-dd'
          examples:
            - '2027-09-04'
        payment:
          $ref: '#/components/schemas/Payment-Create-Request'
          description: Payment template every payment of this recurrence is created from
      examples:
        - type: AUTO
          schedule:
            period: MONTH
            cycle: 1
          recurrence_date_to: '2027-09-04'
          payment:
            amount: 1500
            currency: CZK
            order_number: '2025010199'
            order_description: Monthly subscription
            customer:
              email: john.doe@example.com
              first_name: John
              last_name: Doe
            callback:
              notification_url: 'https://example.com/notify'
              return_url: 'https://example.com/return'
    Recurrence-Create-On-Demand:
      type: object
      title: Recurrence Create On Demand
      description: 'The `ON_DEMAND` variant of the [Recurrence Create Request](#/schemas/Recurrence-Create-Request) union. There is no schedule — the merchant asks for each further payment with the next operation — so `schedule` must not be sent.'
      additionalProperties: false
      required:
        - type
        - recurrence_date_to
        - payment
      properties:
        type:
          const: ON_DEMAND
          type: string
          description: Always `ON_DEMAND`
          examples:
            - ON_DEMAND
        recurrence_date_to:
          type: string
          format: date
          description: 'Last day on which the recurrence may create a payment, as yyyy-MM-dd'
          examples:
            - '2027-09-04'
        payment:
          $ref: '#/components/schemas/Payment-Create-Request'
          description: Payment template every payment of this recurrence is created from
      examples:
        - type: ON_DEMAND
          recurrence_date_to: '2027-09-04'
          payment:
            amount: 1500
            currency: CZK
            order_number: '2025010199'
            order_description: Monthly subscription
            customer:
              email: john.doe@example.com
              first_name: John
              last_name: Doe
            callback:
              notification_url: 'https://example.com/notify'
              return_url: 'https://example.com/return'
    Recurrence-Details:
      title: Recurrence Details
      type: object
      description: State of a recurrence and the payment it last created
      required:
        - id
        - type
        - state
        - recurrence_date_to
        - payment
      properties:
        id:
          type: string
          description: Unique ID of the recurrence
          examples:
            - '8008013370'
        type:
          $ref: '#/components/schemas/Recurrence-Type'
          description: Whether payments are created on a schedule or only on request
        state:
          $ref: '#/components/schemas/Recurrence-State'
          description: Current state of the recurrence
        schedule:
          $ref: '#/components/schemas/Recurrence-Schedule'
          description: Present only for an `AUTO` recurrence
        recurrence_date_to:
          type: string
          format: date
          description: 'Last day on which the recurrence may create a payment, as yyyy-MM-dd'
          examples:
            - '2027-09-04'
        stop_reason:
          $ref: '#/components/schemas/Recurrence-Stop-Reason'
          description: Why the recurrence stopped — present only in state `STOPPED`
        payment:
          $ref: '#/components/schemas/Recurrence-Payment'
          description: Payment the recurrence carries — the stored template until one is created
      examples:
        - id: '8008013370'
          type: ON_DEMAND
          state: NEW
          recurrence_date_to: '2027-09-04'
          payment:
            amount: 1500
            currency: CZK
            order_number: '2025010199'
            customer:
              email: john.doe@example.com
    Recurrence-Payment:
      title: Recurrence Payment
      type: object
      description: >-
        The payment the recurrence carries. Before the recurrence is started this is the stored
        template only; once a payment exists, `id`, `state`, `gw_url` and `payment_secret` are
        filled in as well.
      required:
        - amount
        - currency
        - order_number
        - customer
      properties:
        id:
          type: string
          description: Payment ID. Absent until the recurrence has created a payment
          examples:
            - '7310142951'
        state:
          $ref: '#/components/schemas/Payment-State'
          description: State of the created payment. Absent until the recurrence has created one
        amount:
          type: integer
          description: Total amount in cents
          minimum: 0
          examples:
            - 1500
        currency:
          $ref: '#/components/schemas/Currency'
          description: Payment currency
        order_number:
          type: string
          description: 'Order identification for the online shop, alphanumeric characters'
          maxLength: 128
          examples:
            - '2025010199'
        customer:
          $ref: '#/components/schemas/Customer'
          description: Information about the customer
        gw_url:
          type: string
          description: 'Address of GoPay''s hosted payment gateway, where the customer pays the created payment. It cannot be embedded in the merchant''s own checkout — see `Payment Details.gw_url`. Absent until the recurrence has created one'
          examples:
            - 'https://gate.gopay.com/gw/123456789'
        payment_secret:
          type: string
          description: 'Secret the merchant''s server passes to the GoPay client SDK, so that the SDK can act on the payment. Absent until the recurrence has created a payment. **Do not embed in URLs, log or store!**'
          examples:
            - ps_6aa48c5fadd5ca9ccbc2a30bb13d7e8e
      examples:
        - amount: 1500
          currency: CZK
          order_number: '2025010199'
          customer:
            email: john.doe@example.com
    Recurrence-Type:
      title: Recurrence Type
      type: string
      description: >-
        `AUTO` creates payments on the schedule, `ON_DEMAND` only when the merchant asks for the
        next payment.
      enum:
        - AUTO
        - ON_DEMAND
      examples:
        - ON_DEMAND
    Recurrence-State:
      title: Recurrence State
      type: string
      description: >-
        `NEW` after creation, `REQUESTED` once the first payment was created and is waiting to be
        paid, `STARTED` once it was paid and further payments can be requested, `STOPPED` when
        the recurrence ended.
      enum:
        - NEW
        - REQUESTED
        - STARTED
        - STOPPED
      examples:
        - NEW
    Recurrence-Stop-Reason:
      title: Recurrence Stop Reason
      type: string
      description: |-
        Why a recurrence in state `STOPPED` ended.
        - `RECURRENCE_EXPIRED` - `recurrence_date_to` passed
        - `CARD_EXPIRED` - The authorised card expired
        - `CANCELLED_VIA_API` - Stopped with `DELETE /recurrences/{rec_id}`
        - `CANCELLED_VIA_BACKOFFICE` - Stopped by a GoPay operator on the merchant's behalf
        - `CANCELLED_BY_GOPAY` - Stopped by GoPay
        - `UNKNOWN` - The reason is not available
      enum:
        - RECURRENCE_EXPIRED
        - CARD_EXPIRED
        - CANCELLED_VIA_API
        - CANCELLED_VIA_BACKOFFICE
        - CANCELLED_BY_GOPAY
        - UNKNOWN
      examples:
        - CANCELLED_VIA_API
    Customer-Override:
      title: Customer Override
      type: object
      description: >-
        Customer fields to replace for a single payment. Unlike `Customer` no field is required
        — the recurrence's stored customer supplies whatever is omitted, merged field by field.
        Unknown fields are rejected.
      additionalProperties: false
      properties:
        email:
          type: string
          description: Customer email
          format: email
          maxLength: 128
          examples:
            - john.doe@example.com
        first_name:
          type: string
          description: Customer first name
          maxLength: 256
          examples:
            - John
        last_name:
          type: string
          description: Customer last name
          maxLength: 256
          examples:
            - Doe
        phone_number:
          type: string
          description: Customer phone number (home or mobile)
          maxLength: 128
          examples:
            - '+420123456789'
        city:
          type: string
          description: Customer address city
          maxLength: 128
          examples:
            - Testington
        street:
          type: string
          description: Customer address street
          maxLength: 128
          examples:
            - Example st. 10
        postal_code:
          type: string
          description: Customer address ZIP (postal code)
          maxLength: 128
          examples:
            - '10000'
        country_code:
          type: string
          description: 'Customer country code according to [ISO 3166-1 alpha-3](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-3)'
          maxLength: 128
          examples:
            - CZE
        customer_id:
          type: string
          description: Unique customer ID (used to customise the checkout experience)
          maxLength: 128
          examples:
            - customer420
      examples:
        - first_name: John
          last_name: Doe
    Payment-Instance-Override:
      title: Payment Instance Override
      type: object
      description: >-
        Fields that replace the recurrence's stored payment template for a single payment.
        Omitted fields keep the stored value; `customer` is merged field by field rather than
        replaced. Unknown fields are rejected.
      additionalProperties: false
      properties:
        amount:
          type: integer
          description: 'Total amount in cents. In HUF, the amount must be a multiple of 100'
          minimum: 0
          examples:
            - 9900
        order_number:
          type: string
          description: 'Order identification for the online shop, alphanumeric characters'
          maxLength: 128
          examples:
            - '2025010199'
        order_description:
          type: string
          description: 'Order description, alphanumeric characters'
          examples:
            - Test order
        additional_params:
          type: array
          description: Additional parameters for the payment
          maxItems: 4
          items:
            $ref: '#/components/schemas/Additional-Param'
          examples:
            - - name: Custom param
                value: Custom value
        customer:
          $ref: '#/components/schemas/Customer-Override'
          description: 'Customer fields to replace; omitted ones keep the stored value'
        callback:
          $ref: '#/components/schemas/Payment-Callback'
          description: URLs for the return redirect and the notifications
      examples:
        - amount: 9900
          order_number: '2025010199'
          order_description: Test order
          customer:
            email: john.doe@example.com
            first_name: John
            last_name: Doe
          callback:
            notification_url: 'https://example.com/notify'
            return_url: 'https://example.com/return'
    Link-Create-Request:
      title: Link Create Request
      description: The payment data a new payment link carries, its lifetime, and whether it may be used more than once
      type: object
      required:
        - payment
      properties:
        payment:
          $ref: '#/components/schemas/Payment-From-Link-Request'
          description: Payment data used for every payment this link creates
        expires_in:
          type: integer
          description: 'Link lifetime in seconds, counted from creation. Omit it for a link that never expires. The upper bound is a hundred years'
          minimum: 1
          examples:
            - 3600
        reusable:
          type: boolean
          default: true
          description: 'Whether the link may start more than one payment. A one-shot link is consumed by the first visit; see `Link Stop Reason`'
          examples:
            - true
    Link-Details:
      title: Link Details
      description: A payment link, its state, and the payment data it carries
      type: object
      required:
        - id
        - url
        - active
        - reusable
      properties:
        id:
          type: string
          description: 'Link ID, used on the status and disable calls. Not the code that appears in `url`'
          examples:
            - '3405871122'
        url:
          type: string
          description: 'Address to share with the customer. Opening it creates a payment and redirects the customer to the payment gateway. It ends in a random ten-character code unrelated to `id`'
          examples:
            - 'https://gate.gopay.com/gp-gw/l/Xk8mQ2pR7t'
        active:
          type: boolean
          description: 'Whether the link can still start a payment. Reported as false once the link expires, even before that is recorded'
          examples:
            - true
        reusable:
          type: boolean
          description: Whether the link may start more than one payment
          examples:
            - true
        expires_at:
          type: string
          format: date-time
          description: 'When the link stops being usable, computed at creation from `expires_in`. Absent for a link that never expires'
          examples:
            - '2026-08-18T14:35:12Z'
        stop_reason:
          $ref: '#/components/schemas/Link-Stop-Reason'
          description: Why the link is no longer active. Absent while the link is active
        payment:
          $ref: '#/components/schemas/Payment-From-Link-Request'
          description: Payment data the link carries
    Link-Stop-Reason:
      type: string
      title: Link Stop Reason
      enum:
        - FROM_API
        - USED
        - EXPIRED
      description: |
        Why a payment link is no longer active:
        - `FROM_API` - The merchant disabled the link
        - `USED` - A one-shot link was opened and created its payment
        - `EXPIRED` - The link passed its `expires_at`
      examples:
        - USED
    Payment-From-Link-Request:
      type: object
      title: Payment From Link Request
      description: >-
        Representation of a payment created from a payment link. The same data is used for every
        payment the link creates, so a reusable link gives all of them the same `order_number` and
        the same `notification_url`.
      required:
        - amount
        - currency
        - order_number
        - customer
        - callback
      properties:
        amount:
          type: integer
          description: 'Total amount in cents. In HUF, the amount must be a multiple of 100'
          minimum: 0
          examples:
            - 15000
        currency:
          $ref: '#/components/schemas/Currency'
          description: 'Payment currency. It must be a currency the eshop has an enabled payment channel for, otherwise the link is rejected with `400`'
        order_number:
          type: string
          description: 'Order identification for the online shop, alphanumeric characters'
          maxLength: 128
          examples:
            - '2026-00042'
        order_description:
          type: string
          description: 'Order description, alphanumeric characters'
          maxLength: 256
          examples:
            - Invoice 2026-00042
        additional_params:
          type: array
          description: 'Additional parameters for the payment. Each `name` must not contain `=`, and `name` and `value` together may not exceed 511 characters'
          maxItems: 4
          items:
            $ref: '#/components/schemas/Additional-Param'
          examples:
            - - name: Custom param
                value: Custom value
        customer:
          $ref: '#/components/schemas/Customer'
          description: Information about the customer. The email address is required
        callback:
          $ref: '#/components/schemas/Payment-Callback'
          description: 'URLs for the return redirect and the notifications. `return_url` is required, `notification_url` is optional. Each must be http or https and at most 512 characters long'
      examples:
        - amount: 15000
          currency: CZK
          order_number: '2026-00042'
          order_description: Invoice 2026-00042
          additional_params:
            - name: invoice
              value: INV-2026-001
          customer:
            email: payer@example.com
            first_name: Jan
            last_name: Novák
            phone_number: '+420123456789'
            city: Praha
            street: Testovací 42
            postal_code: '11000'
            country_code: CZE
