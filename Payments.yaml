    Event:
      title: Event
      description: 'One of the events GoPay records. The `type` field selects the case, taking values from the [Event Type](#/schemas/Event-Type) enum. A `type` the merchant''s code does not recognise is ignored rather than treated as an error, so that a new type does not break a working integration.'
      examples:
        - id: 01ARZ3NDEKTSV4RRFFQ69G5FAV
          type: payments.paid
          occurred_at: '2026-07-08T12:04:39.123Z'
          data:
            payment_id: '300000001'
            charge_id: '9123456789'
      oneOf:
        - $ref: '#/components/schemas/Payment-Paid-Event'
        - $ref: '#/components/schemas/Payment-Canceled-Event'
        - $ref: '#/components/schemas/Payment-Timeouted-Event'
        - $ref: '#/components/schemas/Link-Payment-Created-Event'
        - $ref: '#/components/schemas/Link-Disabled-Event'
        - $ref: '#/components/schemas/Refund-Succeeded-Event'
        - $ref: '#/components/schemas/Refund-Failed-Event'
        - $ref: '#/components/schemas/Recurrence-Started-Event'
        - $ref: '#/components/schemas/Recurrence-Payment-Created-Event'
        - $ref: '#/components/schemas/Recurrence-Stopped-Event'
        - $ref: '#/components/schemas/Card-Updated-Event'
        - $ref: '#/components/schemas/Card-Deleted-Event'
      discriminator:
        propertyName: type
        mapping:
          payments.paid: '#/components/schemas/Payment-Paid-Event'
          payments.canceled: '#/components/schemas/Payment-Canceled-Event'
          payments.timeouted: '#/components/schemas/Payment-Timeouted-Event'
          links.payment_created: '#/components/schemas/Link-Payment-Created-Event'
          links.disabled: '#/components/schemas/Link-Disabled-Event'
          refunds.succeeded: '#/components/schemas/Refund-Succeeded-Event'
          refunds.failed: '#/components/schemas/Refund-Failed-Event'
          recurrences.started: '#/components/schemas/Recurrence-Started-Event'
          recurrences.payment_created: '#/components/schemas/Recurrence-Payment-Created-Event'
          recurrences.stopped: '#/components/schemas/Recurrence-Stopped-Event'
          cards.updated: '#/components/schemas/Card-Updated-Event'
          cards.deleted: '#/components/schemas/Card-Deleted-Event'
    Event-Type:
      type: string
      enum:
        - payments.paid
        - payments.canceled
        - payments.timeouted
        - links.payment_created
        - links.disabled
        - refunds.succeeded
        - refunds.failed
        - recurrences.started
        - recurrences.payment_created
        - recurrences.stopped
        - cards.updated
        - cards.deleted
      title: Event Type
      description: 'The values of the field that selects the case of [Event](#/schemas/Event)'
      examples:
        - payments.paid
