openapi: 3.1.0
info:
  version: '4.0'
  title: Payments
  summary: Create and manage payments
  description: >-
    REST API for creating and managing GoPay payments: creating a payment, charging it
    with a payment instrument, following it through to a terminal outcome, and managing
    saved card tokens. The long-form integration guides are published alongside this
    reference.
  contact:
    name: GoPay technical support
    email: integration@gopay.com
servers:
  - url: 'https://gw.sandbox.gopay.com/gp-gw/api/4.0'
    description: Sandbox
  - url: 'https://gate.gopay.com/gp-gw/api/4.0'
    description: Production
tags:
  - name: Authentication
    description: >-
      Exchanging merchant and per-payment credentials for the access tokens that
      authorise every other call.
  - name: Payments
    description: >-
      Creating a payment, charging it with a payment instrument, and following it
      through to a terminal outcome.
  - name: Refunds
    description: >-
      Returning funds from a paid payment to the customer, and reading back the refunds
      a payment carries.
  - name: Payment Links
    description: >-
      Payment links that carry the data for a payment and create it only when the customer
      opens the link.
  - name: Recurrences
    description: >-
      Recurring payments that hold a payment template and create payments from it, either on a
      schedule or when the merchant asks for the next one.
  - name: Cards
    description: >-
      Saved card tokens that stand in for a customer's card on later charges.
  - name: Events
    description: >-
      The eshop's event log and the public keys that verify the signature of a webhook.
  - name: SDK Services
    description: >-
      Operations the GoPay client SDKs call from the customer's browser or app while
      collecting card or wallet data for a charge. The merchant's code does not normally
      call them. When the merchant's server performs the charge, it needs the browser data,
      which the GoPay client SDK also collects for it. The operations are documented for fully
      custom integrations; a custom card-data integration additionally requires a PCI DSS SAQ.
paths:
  /oauth2/token:
    post:
      tags:
        - Authentication
      summary: Authenticate
      description: |-
        Exchanges credentials for an access token.

        The merchant's server presents `client_id:client_secret` with the `client_credentials` grant; the GoPay client SDK presents `payment_id:payment_secret` with the `payment_credentials` grant to obtain a payment-scoped token. Credentials are sent as HTTP Basic and at least one scope must be requested. The returned `access_token` is a JWT valid for fifteen minutes and is presented as a Bearer token on the calls that authenticate with it; the `shareable_key` endpoints use HTTP Basic instead and involve no token exchange.
      operationId: post-oauth2-token
      requestBody:
        required: true
        $ref: '#/components/requestBodies/Access-Token-Request'
      responses:
        '200':
          description: The access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access-Token'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - basic: []
  '/eshops/{goid}/payments':
    post:
      tags:
        - Payments
      summary: Create a payment
      description: |-
        Creates a payment for the given eshop.

        The response carries the payment `id`, the per-payment client credential `payment_secret`, and `gw_url` — the address of GoPay's hosted payment gateway, which offers the customer every payment method the eshop has enabled but cannot be embedded in the merchant's own checkout. The new payment is in the `CREATED` state and awaits a charge attempt; if none is made before the initial timeout expires, it transitions to `TIMEOUTED`.
      operationId: post-eshops-goid-payments
      responses:
        '201':
          description: The new payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment-Create-Request'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: goid
        in: path
        required: true
        description: Unique identifier of a registered merchant website
  '/payments/{payment_id}':
    get:
      tags:
        - Payments
      summary: Payment Status
      description: |-
        Returns the current state of a payment.

        Called after a webhook notification or a return-URL redirect to learn the outcome, since both carry only the payment `id`. The `state` field follows the payment lifecycle from `CREATED` to a terminal outcome.
      operationId: get-payments-payment_id
      responses:
        '200':
          description: The payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Details'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:read'
        - payment_credentials:
            - 'payment:read'
    delete:
      tags:
        - Payments
      summary: Cancel a payment
      description: |-
        Cancels a payment that has not been charged yet.

        The payment transitions to `CANCELED` and remains readable; it is not deleted. Only a payment in the `CREATED` state can be canceled; any other state returns `409`. The operation is server-side only.
      operationId: delete-payments-payment_id
      responses:
        '204':
          description: Done; the response has no body
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/payments/{payment_id}/charge':
    post:
      tags:
        - Payments
      summary: Charge a payment
      description: |-
        Attempts to settle a payment with a payment instrument.

        Only card payments are charged through this endpoint — `payment_instrument` is always `PAYMENT_CARD`, and the card input type nested under it is one of `ENCRYPTED_CARD`, `CARD_TOKEN`, `APPLE_PAY` or `GOOGLE_PAY`. Other payment methods are reachable only through the hosted gateway. The charge is asynchronous; a state of `ACTION_REQUIRED` means the customer must complete an external step before the charge can terminate.
      operationId: post-payments-payment_id-charge
      responses:
        '201':
          description: The charge that was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Charge-Response'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment-Charge-Input'
      security:
        - merchant_credentials:
            - 'payment:write'
        - payment_credentials:
            - 'payment:charge'
    get:
      tags:
        - Payments
      summary: Payment charge state
      description: |-
        Returns the current state of the payment's charge.

        Polled while a charge is in flight, at a recommended cadence of one second, until the state reaches `SUCCEEDED`, `FAILED` or `ACTION_REQUIRED`. On `ACTION_REQUIRED` the response carries an `action` describing the step the customer must complete; once they have, polling resumes until the charge reaches `SUCCEEDED` or `FAILED`. When a charge fails, the reason is carried in `fail_reason`.
      operationId: get-payments-payment_id-charge
      responses:
        '200':
          description: Current state of the payment's charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Charge-Status-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:read'
        - payment_credentials:
            - 'payment:read'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/payments/{payment_id}/qr-payment/info':
    get:
      tags:
        - Payments
      summary: QR Payment Info
      description: |-
        Returns the data needed to display a QR code for settling the payment by bank transfer.

        The response carries the amount, the recipient bank account, and the generated image as a base64 string under the regional format applicable to the payment's currency and recipient country. Requesting a QR code extends the payment's initial timeout to four days and does not change the payment state.
      operationId: get-payments-payment_id-qr-payment-info
      parameters:
        - name: format
          in: query
          description: Image format of the generated QR code
          schema:
            type: string
            enum:
              - png
              - svg
            default: png
            examples:
              - png
      responses:
        '200':
          description: The QR payment data for the payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QR-Payment-Details'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:read'
        - payment_credentials:
            - 'payment:read'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/payments/{payment_id}/google-pay/info':
    get:
      tags:
        - SDK Services
      summary: Google Pay Payment Info
      description: |-
        Returns the Google Pay payment request configuration for the payment.

        Intended for the GoPay client SDK; the merchant's code does not normally call it. The same endpoint serves both the web and the in-app case — the configured environment is carried in `environment`.
      operationId: get-payments-payment_id-info-google-pay
      responses:
        '200':
          $ref: '#/components/responses/Google-Pay-Info-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - payment_credentials:
            - 'payment:read'
        - merchant_credentials:
            - 'payment:read'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/payments/{payment_id}/apple-pay/info':
    get:
      tags:
        - SDK Services
      summary: Apple Pay Payment Info
      description: |-
        Returns the Apple Pay payment request configuration for the payment on the web.

        Intended for the GoPay client SDK; the merchant's code does not normally call it.
      operationId: get-payments-payment_id-info-apple-pay
      responses:
        '200':
          $ref: '#/components/responses/Apple-Pay-Info-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - payment_credentials:
            - 'payment:read'
        - merchant_credentials:
            - 'payment:read'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/payments/{payment_id}/apple-pay/app-info':
    get:
      tags:
        - SDK Services
      summary: Apple Pay Payment Info For Apps
      description: |-
        Returns the Apple Pay payment request configuration for the payment in a native application. It carries `paymentSummaryItems` where the web variant carries a single `total`.

        Intended for the GoPay client SDK; the merchant's code does not normally call it.
      operationId: get-payments-payment_id-apple-pay-app-info
      responses:
        '200':
          $ref: '#/components/responses/Apple-Pay-App-Info-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - payment_credentials:
            - 'payment:read'
        - merchant_credentials:
            - 'payment:read'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/payments/{payment_id}/apple-pay/validate':
    post:
      tags:
        - SDK Services
      summary: Validate Merchant
      description: |-
        Completes the Apple Pay merchant validation handshake for the payment session.

        The `validationUrl` issued by Apple is forwarded to GoPay, which returns the merchant session that the Apple Pay sheet expects. Intended for the GoPay client SDK; the merchant's code does not normally call it.
      operationId: post-payments-payment_id-apple-pay-validate
      parameters:
        - name: Origin
          in: header
          description: The origin of the page where the Apple Pay button is displayed. The browser adds it automatically
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The merchant session for the Apple Pay sheet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validate-Merchant-Response'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - payment_credentials:
            - 'payment:read'
        - merchant_credentials:
            - 'payment:read'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Validate-Merchant-Request'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/payments/{payment_id}/refunds':
    post:
      tags:
        - Refunds
      summary: Refund a payment
      description: |
        Refunds a paid payment in full or in part. Set `amount` to the payment amount for a
        full refund, or to a lower value for a partial refund. A payment can be refunded
        repeatedly until the sum of its refunds reaches the original amount.
      operationId: post-payments-payment_id-refunds
      responses:
        '201':
          description: The new refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Refund-Create-Request'
      security:
        - merchant_credentials:
            - 'payment:write'
    get:
      tags:
        - Refunds
      summary: List payment refunds
      description: Returns every refund issued against the payment.
      operationId: get-payments-payment_id-refunds
      responses:
        '200':
          description: The refunds of the payment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Refund-Details'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:read'
        - payment_credentials:
            - 'payment:read'
    parameters:
      - schema:
          type: string
        name: payment_id
        in: path
        required: true
        description: Identifier of the payment, `Payment Details.id`
  '/refunds/{refund_id}':
    get:
      tags:
        - Refunds
      summary: Refund details
      description: Returns the current state and amount of a single refund.
      operationId: get-refunds-refund_id
      responses:
        '200':
          description: The refund
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Refund-Details'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:read'
    parameters:
      - schema:
          type: string
        name: refund_id
        in: path
        required: true
        description: Identifier of the refund
  '/eshops/{goid}/recurrences':
    post:
      tags:
        - Recurrences
      summary: Create a recurrence
      description: >-
        Registers a recurrence for the eshop and returns it in state `NEW`. The recurrence only
        stores the payment template — no payment exists until the recurrence is started.
        `schedule` is required for an `AUTO` recurrence and must be omitted for an `ON_DEMAND`
        one.
      operationId: post-eshops-goid-recurrences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Recurrence-Create-Request'
      responses:
        '201':
          description: The new recurrence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurrence-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: goid
        in: path
        required: true
        description: Unique identifier of a registered merchant website
  '/recurrences/{rec_id}':
    get:
      tags:
        - Recurrences
      summary: Recurrence status
      description: Returns the current state of the recurrence and the payment it last created.
      operationId: get-recurrences-rec_id
      responses:
        '200':
          description: The recurrence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recurrence-Details'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:read'
    delete:
      tags:
        - Recurrences
      summary: Stop a recurrence
      description: >-
        Stops the recurrence permanently. It moves to state `STOPPED` with `stop_reason`
        `CANCELLED_VIA_API` and creates no further payments. Stopping cannot be undone.
      operationId: delete-recurrences-rec_id
      responses:
        '204':
          description: Done; the response has no body
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: rec_id
        in: path
        required: true
        description: Unique ID of a previously created recurrence
  '/recurrences/{rec_id}/start':
    post:
      tags:
        - Recurrences
      summary: Start a recurrence
      description: >-
        Creates the first payment of the recurrence and moves it to state `REQUESTED`. The
        customer pays that payment at its `gw_url`; once it is paid the recurrence becomes
        `STARTED` and further payments can be requested. The optional body overrides fields of
        the stored payment template for this payment only.
      operationId: post-recurrences-rec_id-start
      requestBody:
        description: Fields to override for this payment only
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment-Instance-Override'
      responses:
        '201':
          description: The new payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: rec_id
        in: path
        required: true
        description: Unique ID of a previously created recurrence
  '/recurrences/{rec_id}/next':
    post:
      tags:
        - Recurrences
      summary: Create a next payment for a recurrence
      description: >-
        Creates a further payment from a recurrence that has already reached state `STARTED`.
        Returns `409` while the recurrence has not been started and its first payment paid. The
        optional body overrides fields of the stored payment template for this payment only.
      operationId: post-recurrences-rec_id-next
      requestBody:
        description: Fields to override for this payment only
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payment-Instance-Override'
      responses:
        '201':
          description: The new payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: rec_id
        in: path
        required: true
        description: Unique ID of a previously created recurrence
  '/eshops/{goid}/links':
    post:
      tags:
        - Payment Links
      summary: Create a payment link
      description: |-
        Creates a payment link for the given eshop. The link only stores the payment data — no payment exists until a customer opens the link.

        The response carries `id`, used on the status and disable calls, and `url`, the address to share with the customer. The two are different identifiers: `url` ends in a random ten-character code that cannot be derived from `id`, nor `id` from the code.
      operationId: post-eshops-goid-links
      responses:
        '201':
          description: The new payment link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Link-Create-Request'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: goid
        in: path
        required: true
        description: Unique identifier of a registered merchant website
  '/eshops/{goid}/links/{link_id}':
    get:
      tags:
        - Payment Links
      summary: Link status
      description: |-
        Returns the current settings and state of a payment link, including the payment data it carries.

        Expiry is evaluated on read: a link past its `expires_at` is reported as `active: false` with `stop_reason` `EXPIRED`, without anything being written first.
      operationId: get-eshops-goid-links-link_id
      responses:
        '200':
          description: The payment link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Link-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:read'
    delete:
      tags:
        - Payment Links
      summary: Disable a link
      description: |-
        Deactivates a payment link so that it can no longer start a new payment. This is not a delete: the link can still be read back, and reports `stop_reason` `FROM_API`.

        Disabling a link that is already inactive returns `409`. A one-shot link that has already been used is inactive too, so it cannot be disabled — it keeps redirecting to the payment it created. To stop that payment, cancel the payment itself.
      operationId: delete-eshops-goid-links-link_id
      responses:
        '204':
          description: Done; the response has no body
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'payment:write'
    parameters:
      - schema:
          type: string
        name: goid
        in: path
        required: true
        description: Unique identifier of a registered merchant website
      - schema:
          type: string
          pattern: '^[0-9]+$'
        name: link_id
        in: path
        required: true
        description: 'Link ID returned when the link was created. A non-numeric or negative value is rejected with `400`'
  /cards/tokens:
    post:
      tags:
        - Cards
      summary: Create card token
      description: |-
        Exchanges an encrypted card payload for a permanent card token.

        The JWE produced by the GoPay client SDK is submitted in `payload` and exchanged for a `Permanent Card Token Details` object. Its `token` is what a later charge carries as `card_token` in the `CARD_TOKEN` input; its `card_id` addresses the saved card in the read and delete operations. The JWE is single-use. Tokenisation is disabled by default and must be enabled for the merchant; the operation is server-side only.
      operationId: post-cards-tokens
      responses:
        '201':
          description: The new saved card token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permanent-Card-Token-Details'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '409':
          $ref: '#/components/responses/Conflict-409-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token-Create-Request'
      security:
        - merchant_credentials:
            - 'card:write'
  '/cards/tokens/{card_id}':
    get:
      tags:
        - Cards
      summary: Card details
      description: |-
        Returns the current details of a saved card.

        Called after the `cards.updated` event to read fields the issuer has updated in place — a reissued PAN or a new expiration date — while the `card_id` stays the same. The API does not list saved cards; the merchant persists the association between `card_id` and customer. Server-side only.
      operationId: get-cards-tokens-card_id
      parameters:
        - name: card_id
          in: path
          required: true
          description: ID of the saved payment card
          schema:
            type: string
      responses:
        '200':
          description: The saved card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permanent-Card-Token-Details'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'card:read'
    delete:
      tags:
        - Cards
      summary: Delete a card
      description: |-
        Permanently deletes a saved card.

        A deleted token is not recoverable; saving the same card again requires a new tokenisation. Server-side only.
      operationId: delete-cards-tokens-card_id
      parameters:
        - name: card_id
          in: path
          required: true
          description: ID of the saved payment card
          schema:
            type: string
      responses:
        '204':
          description: Done; the response has no body
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'card:write'
    parameters:
      - schema:
          type: string
        name: card_id
        in: path
        required: true
        description: ID of the saved payment card
  /cards/public-key:
    get:
      tags:
        - SDK Services
      summary: Fetch public key
      description: |-
        Returns the public encryption key to be used for encrypting card data.

        It is structured as a JWK described by [RFC 7517](https://datatracker.ietf.org/doc/html/rfc7517).

        Intended for the GoPay client SDK; the merchant's code does not normally call it.
      operationId: get-encryption-public-key
      responses:
        '200':
          description: The public encryption key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWK'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - shareable_key: []
        - merchant_credentials:
            - 'shared:read'
  /cards/card-form-url:
    get:
      tags:
        - SDK Services
      summary: Card Form URL
      description: |-
        Returns the URL of the hosted card input form.

        Intended for the GoPay browser SDK, which embeds the form; the merchant's code does not normally call it.
      operationId: get-card-form-url
      responses:
        '200':
          description: The URL of the hosted card form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card-Form-URL'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - shareable_key: []
        - merchant_credentials:
            - 'shared:read'
  /cards/browser-data:
    get:
      tags:
        - SDK Services
      summary: Fetch browser data
      description: |-
        Returns the `Browser Data` fields that the customer's browser cannot determine on its own — the source IP address, the `User-Agent` header, and the `Accept` headers — derived from the request that fetched them.

        The GoPay client SDK calls it from the customer's browser or device immediately before a charge. A call made from the merchant's server returns the server's own values, which the card issuer rejects during 3-D Secure authentication.
      operationId: get-browser-data
      responses:
        '200':
          description: The browser data derived from the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Browser-Data-Detected'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - shareable_key: []
  '/eshops/{goid}/events':
    get:
      tags:
        - Events
      summary: List events
      description: |-
        Returns one page of the eshop's events, newest first.

        Each page carries the URL of the next one in `next_page_url`, with the filters of the
        request and the position to continue from already in it. The field is absent once the
        last matching event has been returned.
      operationId: get-eshops-goid-events
      parameters:
        - name: max_items
          in: query
          description: Maximum number of events in one page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            examples:
              - 20
        - name: prev_item
          in: query
          description: |-
            The `id` of the last event of the previous page. The page starts at the event after it.
            GoPay writes the value into `next_page_url` and the caller follows that URL rather than
            assembling the parameter. A value that has aged out of the 30-day window is rejected.
          schema:
            type: string
            examples:
              - 01H8ZQ7X9K4Q0M2V6T8B3C5D7E
        - name: type
          in: query
          description: |-
            The event types to include, comma-separated in a single parameter, up to 20 items. An item
            is either an exact type (`payments.paid`) or a whole namespace (`payments.*`). An unknown
            type is rejected. Omitted, every type matches.
          schema:
            type: string
            examples:
              - 'refunds.succeeded,refunds.failed,payments.*'
        - name: occurred_after
          in: query
          description: 'Include events that occurred at or after this instant. Must be earlier than `occurred_before` when both are given'
          schema:
            type: string
            format: date-time
            examples:
              - '2026-07-01T00:00:00Z'
        - name: occurred_before
          in: query
          description: Include events that occurred before this instant
          schema:
            type: string
            format: date-time
            examples:
              - '2026-08-01T00:00:00Z'
        - name: related_type
          in: query
          description: 'The kind of entity `related_id` refers to. Required together with `related_id`'
          schema:
            type: string
            enum:
              - payments
              - links
              - refunds
              - recurrences
              - cards
            examples:
              - payments
        - name: related_id
          in: query
          description: |-
            Include only events that carry this identifier, whichever position it appears in within
            `data`. Required together with `related_type`.
          schema:
            type: string
            examples:
              - '300000001'
      responses:
        '200':
          description: One page of the eshop's events, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event-List'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'event:read'
    parameters:
      - schema:
          type: string
          examples:
            - '8123456789'
        name: goid
        in: path
        required: true
        description: Unique identifier of a registered merchant website
  '/eshops/{goid}/events/{event_id}':
    get:
      tags:
        - Events
      summary: Event details
      description: Returns a single event of the eshop by its `id`.
      operationId: get-eshops-goid-events-event_id
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/Bad-Request-400-Response'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '404':
          $ref: '#/components/responses/Not-Found-404-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - merchant_credentials:
            - 'event:read'
    parameters:
      - schema:
          type: string
          examples:
            - '8123456789'
        name: goid
        in: path
        required: true
        description: Unique identifier of a registered merchant website
      - schema:
          type: string
          examples:
            - 01ARZ3NDEKTSV4RRFFQ69G5FAV
        name: event_id
        in: path
        required: true
        description: Identifier of the event
  /webhooks/public-keys:
    get:
      tags:
        - Events
      summary: Fetch webhook signing keys
      description: |-
        Returns the public keys that verify the signature of a webhook.

        The keys are structured as a JWK Set described by
        [RFC 7517](https://datatracker.ietf.org/doc/html/rfc7517). Several keys may be published at
        once while a key is being rotated.
      operationId: get-webhooks-public-keys
      responses:
        '200':
          description: The webhook signing keys currently in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWK-Set'
        '401':
          $ref: '#/components/responses/Unauthorized-401-Response'
        '403':
          $ref: '#/components/responses/Forbidden-403-Response'
        '500':
          $ref: '#/components/responses/Internal-Server-Error-500-Response'
      security:
        - shareable_key: []
        - merchant_credentials:
            - 'shared:read'
components:
  requestBodies:
    Access-Token-Request:
      required: true
      content:
        application/x-www-form-urlencoded:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Client-Credentials-Request'
              - $ref: '#/components/schemas/Payment-Credentials-Request'
          examples:
            Client Credentials:
              value:
                grant_type: client_credentials
                scope: 'payment:write payment:read'
  securitySchemes:
    basic:
      type: http
      description: |-
        Only used to obtain a JWT on `POST /oauth2/token`.
        - The merchant's server uses `client_id:client_secret`
        - The GoPay client SDK uses `payment_id:payment_secret`
        See [RFC 7617](https://www.rfc-editor.org/rfc/rfc7617) for the scheme.
      scheme: basic
    merchant_credentials:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            'card:write': Save and delete card tokens
            'card:read': Read saved card tokens
            'payment:write': 'Create, charge, cancel and modify payments and the resources built on them'
            'payment:read': 'Read payments and the resources built on them'
            'event:read': Read the eshop's events
            'shared:read': 'Read public resources such as public keys, URLs and values derived from the request'
          tokenUrl: /oauth2/token
      description: |-
        Authorizes the merchant's server using `client_id:client_secret`.
        The secret and the JWT must never leave the merchant's server.
    payment_credentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth2/token
          scopes:
            'payment:read': Read the payment
            'payment:charge': Charge the payment
      description: |-
        Authorizes a client for payment-specific operations using `payment_id:payment_secret`.
        These credentials and the JWT are used by the GoPay client SDK in the merchant's web or mobile app.
        The client presents `payment_id:payment_secret` as HTTP Basic on `POST /oauth2/token` with `grant_type=payment_credentials` and requests `payment:read`, `payment:charge`, or both. The returned JWT is bound to the payment and valid for fifteen minutes. The exchange may be repeated to obtain a fresh JWT; `payment_secret` does not expire, and an operation that the payment's state no longer allows is rejected, mostly with `409`.
    shareable_key:
      type: http
      scheme: basic
      description: |-
        `client_id:shareable_key` encoded in base64 in the Authorization header. `shareable_key` is configured in the GoPay client SDK.
        Used to authenticate to endpoints holding public resources such as public keys and URLs, and values derived from the request itself.
        See [RFC 7617](https://www.rfc-editor.org/rfc/rfc7617) for the scheme.
  responses:
    Google-Pay-Info-Response:
      description: Google Pay payment request configuration consumed by the Google Pay button
      content:
        application/json:
          schema:
            type: object
            properties:
              environment:
                description: 'Google Pay environment the payment runs in: `TEST` in the sandbox, `PRODUCTION` in production'
                type: string
                enum:
                  - TEST
                  - PRODUCTION
                examples:
                  - TEST
              paymentDataRequest:
                description: 'The Google Pay `PaymentDataRequest` object passed to the Google Pay API'
                type: object
                properties:
                  apiVersion:
                    description: Major version of the Google Pay API
                    type: integer
                    examples:
                      - 2
                  apiVersionMinor:
                    description: Minor version of the Google Pay API
                    type: integer
                    examples:
                      - 0
                  allowedPaymentMethods:
                    description: Payment methods the Google Pay sheet offers
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          description: Type of the payment method
                          type: string
                          examples:
                            - CARD
                        parameters:
                          description: Card authentication methods and networks accepted
                          type: object
                          properties:
                            allowedAuthMethods:
                              description: Card authentication methods accepted
                              examples:
                                - - PAN_ONLY
                                  - CRYPTOGRAM_3DS
                              type: array
                              items:
                                type: string
                                enum:
                                  - PAN_ONLY
                                  - CRYPTOGRAM_3DS
                            allowedCardNetworks:
                              description: Card networks accepted
                              examples:
                                - - MASTERCARD
                                  - VISA
                              type: array
                              items:
                                type: string
                                enum:
                                  - VISA
                                  - MASTERCARD
                        tokenizationSpecification:
                          description: How Google Pay encrypts the payment data for GoPay
                          type: object
                          properties:
                            type:
                              description: Tokenization type
                              type: string
                              examples:
                                - PAYMENT_GATEWAY
                            parameters:
                              description: Gateway parameters
                              type: object
                              properties:
                                gateway:
                                  description: Gateway identifier registered with Google Pay
                                  type: string
                                  examples:
                                    - gopay
                                gatewayMerchantId:
                                  description: Merchant identifier at the gateway
                                  type: string
                                  examples:
                                    - '26046768005768011132'
                  transactionInfo:
                    description: Amount and currency shown in the Google Pay sheet
                    type: object
                    properties:
                      currencyCode:
                        description: Currency of the payment
                        $ref: '#/components/schemas/Currency'
                      countryCode:
                        description: ISO 3166-1 alpha-2 code of the merchant's country
                        type: string
                        examples:
                          - CZ
                      totalPriceStatus:
                        description: Whether the total is final
                        type: string
                        examples:
                          - FINAL
                      totalPrice:
                        description: Total amount as a decimal string
                        type: string
                        examples:
                          - '5.00'
                  merchantInfo:
                    description: Merchant name and Google merchant identifier
                    type: object
                    properties:
                      merchantName:
                        description: Merchant name shown in the Google Pay sheet
                        type: string
                        examples:
                          - GoPay Czech
                      merchantId:
                        description: Google merchant identifier
                        type: string
                        examples:
                          - '14846034534970557458'
                  emailRequired:
                    description: Whether Google Pay asks the customer for an email address
                    examples:
                      - true
                    type: boolean
            x-examples:
              Example 1:
                enabled: true
                environment: PRODUCTION
                paymentDataRequest:
                  apiVersion: 2
                  apiVersionMinor: 0
                  allowedPaymentMethods:
                    - type: CARD
                      parameters:
                        allowedAuthMethods:
                          - PAN_ONLY
                          - CRYPTOGRAM_3DS
                        allowedCardNetworks:
                          - MASTERCARD
                          - VISA
                      tokenizationSpecification:
                        type: PAYMENT_GATEWAY
                        parameters:
                          gateway: gopay
                          gatewayMerchantId: '26046768005768011132'
                  transactionInfo:
                    currencyCode: CZK
                    countryCode: CZ
                    totalPriceStatus: FINAL
                    totalPrice: '5.00'
                  merchantInfo:
                    merchantName: GoPay Czech
                    merchantId: '14846034534970557458'
                  emailRequired: true
          examples: {}
    Apple-Pay-Info-Response:
      description: Apple Pay payment request object consumed by the Apple Pay button
      content:
        application/json:
          schema:
            type: object
            x-examples:
              Example 1:
                enabled: true
                applePayPaymentRequest:
                  merchantCapabilities:
                    - supports3DS
                    - supportsCredit
                    - supportsDebit
                  supportedNetworks:
                    - maestro
                    - masterCard
                    - electron
                    - visa
                    - vPay
                  countryCode: CZ
                  currencyCode: CZK
                  requiredBillingContactFields: []
                  requiredShippingContactFields: []
                  applicationData: OTIyMzg3MzA0Ng==
                  total:
                    label: GoPay Czech
                    amount: '5.00'
                    type: final
                merchantDisplayName: GoPay Czech
                merchantIdentifier: '8398119642'
                applepayVersion: 6
            properties:
              applepayVersion:
                description: Apple Pay JS API version the request is built for
                type: integer
                examples:
                  - 6
              merchantIdentifier:
                description: Apple merchant identifier
                type: string
                examples:
                  - '8398119642'
              applePayPaymentRequest:
                description: The Apple Pay payment request passed to Apple Pay
                type: object
                properties:
                  merchantCapabilities:
                    description: Payment capabilities the merchant supports
                    examples:
                      - - supports3DS
                    type: array
                    items:
                      type: string
                  supportedNetworks:
                    description: Card networks accepted
                    examples:
                      - - masterCard
                        - visa
                    type: array
                    items:
                      type: string
                      enum:
                        - maestro
                        - masterCard
                        - electron
                        - visa
                        - vPay
                  countryCode:
                    description: ISO 3166-1 alpha-2 code of the merchant's country
                    type: string
                    examples:
                      - CZ
                  currencyCode:
                    description: Currency of the payment
                    $ref: '#/components/schemas/Currency'
                  requiredBillingContactFields:
                    description: Billing contact fields Apple Pay asks for
                    examples:
                      - []
                    type: array
                    items:
                      type: string
                  requiredShippingContactFields:
                    description: Shipping contact fields Apple Pay asks for
                    examples:
                      - []
                    type: array
                    items:
                      type: string
                  applicationData:
                    description: Data Apple Pay returns hashed in the payment token
                    examples:
                      - OTIyMzg3MzA0Ng==
                    type: string
                  total:
                    description: Total shown in the Apple Pay sheet
                    type: object
                    properties:
                      label:
