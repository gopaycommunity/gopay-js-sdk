# Publishes @gopaycz/gopay-js-sdk and -browser to npm from a release tag.
# Tags come from the Bitbucket `Sync master to GitHub` mirror: <x.y.z> -> sdk, browser-sdk-<x.y.z> -> browser-sdk.
# Never add an NPM_TOKEN secret: Yarn resolves npmAuthToken before OIDC, silently disabling trusted publishing.

name: Publish to npm

# How the Bitbucket dispatch finds this run again to wait on. The tag alone is ambiguous — dry
# runs and manual backfills of the same tag share it — so an automated dispatch appends its own
# token. Manual runs pass none and keep the plain name.
run-name: Publish ${{ inputs.tag || github.ref_name }}${{ inputs.dispatch-id && format(' [{0}]', inputs.dispatch-id) || '' }}

on:
    push:
        tags:
            # Filter globs, not regex: `+` is "one or more of the preceding character".
            - '[0-9]+.[0-9]+.[0-9]+'
            - 'browser-sdk-[0-9]+.[0-9]+.[0-9]+'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag to publish, e.g. 1.14.1 or browser-sdk-1.6.0'
                required: true
                type: string
            dry-run:
                description: 'Pack and report only — do not publish to npm'
                required: false
                default: true
                type: boolean
            dist-tag:
                description: 'npm dist-tag. Keep `latest` for normal releases; set something else to backfill an old version without moving `latest`.'
                required: false
                default: 'latest'
                type: string
            dispatch-id:
                description: 'Leave empty. Set only by the Bitbucket sync step, so it can identify the run it started.'
                required: false
                default: ''
                type: string

# Per package, not per tag: same-package publishes must serialize or they race the dist-tag guard
# below. `queue: max` keeps pending runs; the default discards all but one.
concurrency:
    group: npm-publish-${{ startsWith(inputs.tag || github.ref_name, 'browser-sdk-') && 'browser-sdk' || 'sdk' }}
    cancel-in-progress: false
    queue: max

permissions:
    contents: read

jobs:
    publish:
        name: Publish ${{ inputs.tag || github.ref_name }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            # npm does not support trusted publishing from self-hosted runners.
            id-token: write
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
            DRY_RUN: ${{ inputs.dry-run || false }}
            DIST_TAG: ${{ inputs.dist-tag || 'latest' }}
            # Yarn 4 defaults to registry.yarnpkg.com, and nothing here overrides it.
            YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
            # Gates the publish step, not the job, so disarmed runs still build and verify.
            ARMED: ${{ vars.GOPAY_NPM_PUBLISH == 'true' }}
        steps:
            # Before checkout, so a bad dispatch input is rejected before use as a git ref.
            - name: Resolve tag to workspace
              id: target
              run: |
                  set -euo pipefail

                  case "$TAG" in
                      browser-sdk-*)
                          dir=browser-sdk
                          workspace='@gopaycz/gopay-js-sdk-browser'
                          version=${TAG#browser-sdk-}
                          ;;
                      *)
                          dir=sdk
                          workspace='@gopaycz/gopay-js-sdk'
                          version=$TAG
                          ;;
                  esac

                  if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "::error::'$TAG' is not a release tag (expected <x.y.z> or browser-sdk-<x.y.z>)."
                      exit 1
                  fi

                  if [ "$dir" = browser-sdk ]; then tag="browser-sdk-$version"; else tag="$version"; fi

                  {
                      echo "dir=$dir"
                      echo "workspace=$workspace"
                      echo "version=$version"
                      echo "tag=$tag"
                  } >> "$GITHUB_OUTPUT"

                  echo "$workspace $version (from tag $tag)"

            # Pinned to SHA, not tag: this job mints an OIDC token and a tag can be moved.
            - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  ref: refs/tags/${{ steps.target.outputs.tag }}
                  persist-credentials: false

            # Twice, deliberately, and it is idempotent. Before: setup-node v5 caches by default
            # when package.json has `packageManager`, and probes `yarn cache dir` inside its own
            # step, hitting the runner's Yarn 1.x without a shim. After: setup-node prepends the
            # Node 24 toolcache bin, which ships no `yarn`, so the shim has to be re-established
            # for that Node rather than left behind on the runner's default one.
            - name: Enable Corepack (for setup-node's cache probe)
              run: corepack enable

            - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
              with:
                  node-version: 24

            - name: Enable Corepack (for the installed Node)
              run: corepack enable

            # Holds at a release tag because workspaces resolve as 0.0.0-use.local in yarn.lock.
            - name: Install dependencies
              run: yarn install --immutable

            - name: Verify tag matches package.json
              working-directory: ${{ steps.target.outputs.dir }}
              env:
                  EXPECTED: ${{ steps.target.outputs.version }}
              run: |
                  set -euo pipefail
                  actual=$(node -p "require('./package.json').version")
                  if [ "$actual" != "$EXPECTED" ]; then
                      echo "::error::Tag $TAG expects version $EXPECTED but package.json says $actual."
                      exit 1
                  fi
                  echo "package.json version $actual matches tag."

            - name: Build
              run: yarn workspace ${{ steps.target.outputs.workspace }} run build

            - name: Verify build output
              working-directory: ${{ steps.target.outputs.dir }}
              run: |
                  set -euo pipefail
                  # Concatenation, not template literals: `${...}` here trips shellcheck SC2016.
                  node -e '
                      const fs = require("node:fs");
                      const pkg = require("./package.json");
                      const paths = new Set(
                          [
                              pkg.main,
                              pkg.module,
                              pkg.types,
                              pkg.browser,
                              ...Object.values(pkg.exports?.["."] ?? {}),
                          ].filter(Boolean),
                      );
                      const missing = [...paths].filter((p) => !fs.existsSync(p));
                      if (missing.length) {
                          console.log("::error::Build output missing: " + missing.join(", "));
                          process.exit(1);
                      }
                      console.log("Verified " + paths.size + " published entry point(s).");
                  '

            # Skips the registry call, so it cannot prove the trusted-publisher config.
            - name: Publish (dry run)
              if: env.DRY_RUN == 'true'
              working-directory: ${{ steps.target.outputs.dir }}
              run: |
                  yarn npm publish --dry-run
                  echo "::warning::DRY RUN — ${{ steps.target.outputs.workspace }} ${{ steps.target.outputs.version }} was NOT published. Re-run with 'Pack and report only' unchecked to publish for real."

            # Backfilling newest-first would repoint `latest` at the oldest version.
            - name: Guard the latest dist-tag
              if: env.DRY_RUN != 'true' && env.ARMED == 'true' && env.DIST_TAG == 'latest'
              env:
                  WORKSPACE: ${{ steps.target.outputs.workspace }}
                  VERSION: ${{ steps.target.outputs.version }}
              run: |
                  set -euo pipefail
                  # Fails closed: only E404 means "not published yet". Swallowing every error would
                  # turn a registry outage into a pass, which is what the guard exists to prevent.
                  # stderr is kept out of stdout so npm's warnings cannot end up inside $current.
                  err="$RUNNER_TEMP/npm-view.err"
                  if current=$(npm view "$WORKSPACE" version --registry "$YARN_NPM_PUBLISH_REGISTRY" 2>"$err"); then
                      current=$(printf '%s' "$current" | tr -d '"[:space:]')
                  elif grep -q 'E404' "$err"; then
                      echo "Not published yet — no dist-tag to move backwards."
                      exit 0
                  else
                      echo "::error::Could not read the published version, refusing to publish: $(cat "$err")"
                      exit 1
                  fi
                  highest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
                  if [ "$VERSION" != "$highest" ]; then
                      echo "::error::Publishing $VERSION as 'latest' would move it backwards from the currently published $current. Either publish the missing versions in ascending order, or re-run with the dist-tag input set to something other than 'latest'."
                      exit 1
                  fi
                  echo "$VERSION is at or above the published latest ($current) — safe."

            # yarn, not npm, so the packed manifest keeps rewriting workspace:* to a real version.
            # --tolerate-republish because the mirror force-pushes tags, so one can be re-delivered.
            - name: Publish to npm
              id: publish
              if: env.DRY_RUN != 'true' && env.ARMED == 'true'
              working-directory: ${{ steps.target.outputs.dir }}
              run: yarn npm publish --tolerate-republish --tag "$DIST_TAG"

            # Otherwise a disarmed run goes green and looks like it published.
            - name: Not armed
              if: env.DRY_RUN != 'true' && env.ARMED != 'true'
              run: |
                  echo "::warning::Repository variable GOPAY_NPM_PUBLISH is not 'true' — built and verified ${{ steps.target.outputs.workspace }} ${{ steps.target.outputs.version }} but did not publish. Register the trusted publishers on npmjs.com and set the variable to arm this workflow."

            - name: Summary
              if: always()
              env:
                  PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
              run: |
                  if [ "$DRY_RUN" = 'true' ]; then
                      outcome='dry run — not published'
                  elif [ "$ARMED" != 'true' ]; then
                      outcome='not armed — not published'
                  elif [ "$PUBLISH_OUTCOME" = 'success' ]; then
                      outcome="published to npm under \`$DIST_TAG\`"
                  else
                      outcome="publish $PUBLISH_OUTCOME — NOT published"
                  fi
                  {
                      echo "| | |"
                      echo "|---|---|"
                      echo "| Package | \`${{ steps.target.outputs.workspace }}\` |"
                      echo "| Version | \`${{ steps.target.outputs.version }}\` |"
                      echo "| Tag | \`${{ steps.target.outputs.tag }}\` |"
                      echo "| Auth | trusted publishing (OIDC), no token |"
                      echo "| Outcome | $outcome |"
                  } >> "$GITHUB_STEP_SUMMARY"
